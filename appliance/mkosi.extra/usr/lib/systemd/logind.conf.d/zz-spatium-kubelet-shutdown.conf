# #1976 — let the kubelet delay a shutdown long enough to stop its pods.
#
# The kubelet's graceful node shutdown (shutdownGracePeriod 60s, in
# /usr/lib/spatiumddi/kubelet.conf.d/50-spatium-graceful-shutdown.conf)
# holds a logind delay lock, and logind waits for a delay lock at most
# InhibitDelayMaxSec before it shuts down anyway. When that is shorter than
# the grace period the kubelet tries to raise it with its own
# /etc/systemd/logind.conf.d/99-kubelet.conf, and when that does not take,
# it starts without its shutdown manager: no lock, and no graceful shutdown.
#
# Why "zz-": logind applies its drop-ins in file-name order, across /etc,
# /run and /usr/lib alike, and the last value wins. The image's
# unattended-upgrades (mkosi.conf) ships
# unattended-upgrades-logind-maxdelay.conf with InhibitDelayMaxSec=30, a
# name that sorts after every numbered drop-in, the kubelet's 99-kubelet.conf
# included. A nightly-20261024 node reads InhibitDelayMaxUSec 30000000 from
# it. This file must sort after it.
[Login]
InhibitDelayMaxSec=60
