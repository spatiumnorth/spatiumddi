# #1976 — kubelet graceful node shutdown.
#
# A reboot or power-off of a node (the Fleet reboot that finishes a per-node
# upgrade, the console's reboot, the power button) used to reach the pods
# only through systemd's shutdown: every container was stopped at once while
# the kubelet died with k3s, so nothing told the cluster. The node's pods
# stayed Ready in their Services' endpoints until node-lifecycle marked the
# node Unknown about 70 s after its last heartbeat, and were evicted 30 s
# after that: requests kept going to a node that had gone, and a singleton
# such as celery-beat had no running replica for that whole time.
#
# With a grace period the kubelet holds a logind "delay" inhibitor lock.
# When a shutdown is requested it reports the node NotReady ("node is
# shutting down") at once, terminates its pods (TERM, then KILL after the
# period), marks them Failed so their controllers replace them on the other
# nodes, and only then releases the lock and lets the shutdown go on.
# Ordinary pods get up to 45 s (shutdownGracePeriod minus the critical
# share), pods of the system-*-critical classes the last 15 s. A pod whose
# own terminationGracePeriodSeconds is shorter keeps its own.
#
# logind must allow the kubelet to delay the shutdown for that long:
# /usr/lib/systemd/logind.conf.d/zz-spatium-kubelet-shutdown.conf sets
# InhibitDelayMaxSec to the same 60 s. Keep the two in step.
#
# Installed into k3s's kubelet drop-in directory by an ExecStartPre of
# k3s.service; k3s writes its own defaults there as 00-k3s-defaults.conf and
# the kubelet merges the drop-ins in name order.
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
shutdownGracePeriod: 60s
shutdownGracePeriodCriticalPods: 15s
