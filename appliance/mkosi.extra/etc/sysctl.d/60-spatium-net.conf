# #4544 — a 1 MiB default UDP receive buffer, so Kea's DHCP socket can absorb a
# short stall of its receive thread instead of dropping the burst.
#
# kea-dhcp4 never calls setsockopt(SO_RCVBUF) and has no option for it, so its
# socket takes net.core.rmem_default (212992 stock, ~0.2-0.5 s of DHCP arrivals
# at the soak's rate). Raising rmem_max alone would change nothing; both are set
# so the two agree. 1 MiB absorbs a 1-2 s stall. Do NOT go higher without
# measuring: the worst-case added wait is the buffer's drain time plus the
# packet queue's, and that must stay under the client's 4 s first retransmit
# (#952 measured an 8 MiB buffer turning drops into a 34 s DORA).
#
# Host-wide: every UDP socket opened after this is set (BIND, chrony, lldpd, the
# agents) gets the same default. Memory is charged only for packets actually
# queued, so the cost is small. It applies to sockets opened after it is set:
# systemd-sysctl.service runs in early boot, before k3s and so before Kea.
#
# Verify on a node: ss -uanm 'sport = :67'   (skmem rb = buffer, d = drops)
net.core.rmem_default = 1048576
net.core.rmem_max = 1048576
