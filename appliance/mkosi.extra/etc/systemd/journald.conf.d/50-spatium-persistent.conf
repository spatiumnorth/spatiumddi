# #4801 — keep the journal across reboots. /var is its own partition on the
# appliance, so the /var/log/journal directory baked into the slot rootfs is
# hidden under that mount; without it journald stays volatile (Storage=auto)
# and a first-boot failure's logs are gone after the first reboot.
# Storage=persistent makes journald create the directory on /var itself.
[Journal]
Storage=persistent
SystemMaxUse=200M
