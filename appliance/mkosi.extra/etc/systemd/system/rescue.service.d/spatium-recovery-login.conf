# #5027 — the GRUB "recovery" entry boots rescue.target, whose stock
# ExecStart (systemd-sulogin-shell → sulogin) asks for ROOT's password. Root
# is locked on a default install (#995 item 12), so sulogin printed "Cannot
# open access to console, the root account is locked." and the boot carried
# on: no shell at all.
#
# spatium-recovery-login asks for a username + password on every enabled
# console (tty0 and ttyS0, both on that entry's cmdline), authenticates
# through PAM via login(1), and takes only root (when it has a password) and
# members of the `sudo` group. When the shell ends it continues to the
# default target, as systemd-sulogin-shell does.
#
# Only rescue.service. Normal boots never reach it, so the console dashboard
# and the getty drop-ins are untouched. emergency.service keeps sulogin: it
# is not on any GRUB entry, runs with a bare root filesystem, and is a
# separate decision.
#
# StandardInput=null: the script opens each console itself. The stock
# tty-force would make /dev/console the service's controlling tty and the
# per-console login sessions could then not take their own.
[Service]
StandardInput=null
StandardOutput=journal
StandardError=journal
ExecStart=
ExecStart=-/usr/local/bin/spatium-recovery-login
