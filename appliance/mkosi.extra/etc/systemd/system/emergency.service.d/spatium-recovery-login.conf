# #5027 — emergency mode gets the same admin login as rescue mode, on every
# slot. The stock emergency.service runs sulogin, which asks for ROOT's
# password; root is locked on a default install (#995 item 12), so it gave no
# shell. The installer used to work around that with a drop-in that set
# SYSTEMD_SULOGIN_FORCE=1 (a password-free root shell), which reached only the
# slot it was written for: it lives in the /etc overlay, which is mounted
# after systemd has loaded its units. This file ships in the image's own /etc,
# the copy systemd reads at boot, so it applies to every slot. Emergency mode
# is never password-free.
#
# emergency.target mounts nothing but the root filesystem, so the admin
# account (in the /etc overlay on /var) is not visible yet:
# spatium-recovery-login --emergency mounts /var and the /etc overlay
# read-only for the session and unmounts them before the boot continues. See
# the script's header for what it shows when it cannot.
#
# An existing install may still hold the installer's 10-spatium-sulogin.conf
# (Environment=SYSTEMD_SULOGIN_FORCE=1, no ExecStart). It is harmless: drop-ins
# merge in filename order, "10-" sorts before "spatium-", and sulogin no longer
# runs, so nothing reads the variable.
#
# StandardInput=null, as in rescue.service.d: the script opens each console.
[Service]
StandardInput=null
StandardOutput=journal
StandardError=journal
ExecStart=
ExecStart=-/usr/local/bin/spatium-recovery-login --emergency
