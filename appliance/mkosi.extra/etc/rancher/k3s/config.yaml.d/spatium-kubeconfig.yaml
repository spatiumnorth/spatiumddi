# GHSA-h2j9-qrg7-grfw — who may read the cluster-admin kubeconfig k3s
# writes to /etc/rancher/k3s/k3s.yaml.
#
# It is cluster-admin: whoever reads it can start a privileged pod and is
# root on the host. It used to be 0644 (config.yaml), i.e. readable by
# every local account, including the unprivileged daemons that parse
# network input (snmpd, lldpd).
#
# 0640 root:2770 (group ``spatium-host``). Two readers need it without
# being root, and both carry that gid:
#   * the supervisor's in-pod ``spatium`` user (read_kubeconfig ships it,
#     mTLS-wrapped, to the control plane for the operator's download);
#   * the installer's admin account, which spatiumddi-firstboot adds to
#     ``spatium-host`` so /etc/profile.d/k3s.sh's no-sudo kubectl keeps
#     working.
# Everything else that reads it (firstboot, the console, the cluster
# scripts) runs as root.
#
# k3s re-applies both on every start, when it rewrites the file. The gid
# is numeric on purpose: k3s chowns by number when given one, so this
# does not depend on the group having been created yet.
#
# A drop-in rather than a config.yaml edit: config.yaml can live in the
# /etc overlay upper on an existing install, where a new slot image never
# replaces it, while a new file in the image's /etc shows through.
write-kubeconfig-mode: "0640"
write-kubeconfig-group: "2770"
