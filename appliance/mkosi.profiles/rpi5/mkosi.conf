# Raspberry Pi 5 profile (opt-in) — arm64 Phase 3 / #1026.
#
# The Pi 5's onboard Ethernet sits behind the RP1 south-bridge and needs the
# Raspberry Pi RP1 driver stack. Debian trixie's generic linux-image-arm64
# (6.12) has no RP1 Ethernet support (it matured upstream around 6.13->6.18),
# so on a Pi 5 the onboard NIC never comes up. This profile swaps in the
# Raspberry Pi downstream kernel for Pi-5 builds ONLY; default arm64 (Graviton /
# Ampere / Apple) is untouched and stays on the generic kernel.
#
# Select it:  mkosi --profile rpi5
#   via:      make appliance ... APPLIANCE_ARCH=linux/arm64 APPLIANCE_PROFILE=rpi5
#
# The RPi archive + signing key ride along in ./mkosi.pkgmngr (auto-included
# for this profile), so apt trusts archive.raspberrypi.com during the build.
#
# Deployment (EDK2 device-tree mode, matching DTB, C1-vs-D0 firmware caveat,
# stick-free NVMe boot): docs/deployment/RASPBERRY_PI_5.md.

[Match]
Architecture=arm64

[Content]
Packages=
        linux-image-rpi-2712
        raspi-firmware
        raspberrypi-archive-keyring
RemovePackages=
        linux-image-arm64
