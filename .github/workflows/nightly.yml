name: Nightly

# Nightly build of `main` (#805).
#
# WHY THIS EXISTS. Every published image and ISO comes from release.yml,
# which fires only on a CalVer tag — so nothing builds the *release* image
# except a release. That is how #732 survived: the api image shipped its
# `dev` stage (pytest, as root) and nobody noticed until a release cut it.
# It is also why a base-image CVE introduced by a Dockerfile change sits
# undetected until the next release publishes something for
# trivy-scheduled.yml to scan.
#
# RETENTION, split by artifact because they fail differently:
#
#   Images — `:nightly` is the mutable pointer everyone pulls, plus a ring
#     of `:nightly-YYYYMMDD` pruned to the newest 7. Keeping literally one
#     would mean that when somebody reports "nightly broke X" the tag has
#     already rolled and there is nothing to compare against, and a broken
#     nightly would leave no fallback. Seven dated tags prune in the same
#     run and cost nothing; anyone pulling `:nightly` never sees them.
#     What the prune bounds is the TAG ring — untagged multi-arch children
#     are left alone because deleting them would break the tags that
#     reference them (see the prune job). Orphaned layers are GHCR's
#     untagged-retention policy to collect, not this workflow's.
#
#   Pre-releases — ONE per nightly, tagged `nightly-YYYY.MM.DD` (CalVer
#     date, prefixed so it can never match release.yml's bare-CalVer tag
#     trigger and fire a release build). The previous design reused a
#     single `nightly` pre-release with assets replaced in place — which
#     made GitHub show the release's original creation date forever, so
#     every nightly looked a week stale. Per-night releases carry the
#     appliance ISO + slot image (~1.5 GB/night) and are pruned to the
#     trailing 7 DAYS by the prune-releases job below (release + git tag
#     both), so the standing asset cost is bounded at ~10 GB and the
#     Releases page shows at most a week of clearly-labelled nightlies.
#     prune-release-assets.sh skips `nightly-*` so these never consume the
#     real releases' keep-window slots.
#
#   Appliance ISO + slot image — attached to that night's pre-release
#     under their dated names. The BUILD is the same `workflow_call`
#     reusable workflow release.yml invokes (build-appliance.yml) — one
#     copy of the most safety-critical assembly in the repo, exercised
#     nightly so a regression in it surfaces the next morning instead of
#     at the next release cut. (#805 deferred this exactly because a
#     copied job would have been a second divergent copy, untestable
#     short of a release.)
#
# NIGHTLY IS NEVER `:latest`. That tag means "latest release" and has to
# keep meaning that. Nightly pre-releases are marked `--prerelease`, so
# they never become the /releases/latest target either.

on:
  schedule:
    # FALLBACK ONLY. The nightly is normally started at 20:05
    # America/New_York by nightly-trigger.yml, so the pre-release is done
    # by ~21:00 for the evening QA walk. GitHub starts crons in this repo
    # 40 min to 7½ h late, so that workflow fires early, waits for the
    # instant, and dispatches this one. These crons cover the night the
    # trigger never fires (GitHub also drops scheduled runs outright):
    # the gate builds only when the evening produced no nightly, and
    # names the build after that evening (see "Which evening" below).
    #
    # Slot: 03:23 America/New_York. Cron is UTC-only, so schedule both
    # candidate UTC hours (07:23 = 03:23 EDT, 08:23 = 03:23 EST) and let
    # the gate job keep exactly the one whose SCHEDULED slot reads 03 on
    # the Eastern clock — the other fires and immediately skips. The gate
    # decides from the cron string GitHub hands it (github.event.schedule),
    # never from the clock at run time — see above for how late these
    # runs start.
    #
    # The :23 is not decoration and must not be rounded to :00 — same
    # reason prune-release-assets.yml is off the hour: the top-of-hour
    # cron stampede delays runner scheduling on GitHub's shared
    # infrastructure, and these runs are already started up to 13 h late.
    #
    # 03:xx rather than the original 02:xx is also a CORRECTNESS fix, not
    # just a later slot. On the spring-forward night the Eastern clock
    # jumps 01:59 → 03:00, so no 02:xx exists and BOTH twins skipped: the
    # nightly silently built nothing once a year. 03:xx exists on every
    # night of the year, including both transitions. Verified against
    # tzdata for normal EDT, normal EST, and both DST nights in 2026-2028:
    # exactly one twin builds in every case.
    - cron: "23 7 * * *"
    - cron: "23 8 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if main has not moved since the last nightly"
        type: boolean
        required: false
        default: false
      dry_run:
        description: "Build and scan, but push nothing and prune nothing"
        type: boolean
        required: false
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

permissions:
  contents: read

# A manual dispatch must never race the scheduled run onto the same tags.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # ── Should this run at all, and what is it building? ──────────────────
  gate:
    name: Decide
    # Forks inherit this workflow (#830); never run the publisher outside
    # the canonical repo. Every other job needs this one, so the guard
    # cascades.
    if: github.repository_owner == 'spatiumnorth'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      images: ${{ steps.decide.outputs.images }}
      date_tag: ${{ steps.decide.outputs.date_tag }}
      release_tag: ${{ steps.decide.outputs.release_tag }}
      version: ${{ steps.decide.outputs.version }}
      last_sha: ${{ steps.decide.outputs.last_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
          # The cron string that fired ("23 7 * * *"); empty on dispatch.
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          # ── Which twin fired? ────────────────────────────────────────
          # Two UTC crons cover 03:23 America/New_York across DST (see the
          # trigger comment). Keep the twin whose SCHEDULED slot reads 03
          # on the Eastern clock; the other is a no-op. Manual dispatch
          # always proceeds.
          #
          # The slot comes from the cron string that fired, NOT from the
          # clock when this step runs. GitHub starts scheduled runs late —
          # 40 min to 13 h on this repo, every night since the twin crons
          # landed — and the previous form of this gate compared the
          # run-time Eastern hour to 02, so both twins always woke outside
          # 02:xx and both skipped: no scheduled nightly built between
          # 2026-08-09 and this change (the only nightly in that window
          # was a manual dispatch). The cron string is immune to the delay.
          #
          # DST nights: on the fall-back night the 07:23 twin reads 02:23
          # EST and the 08:23 twin 03:23 EST — one build. On the
          # spring-forward night the 07:23 twin reads 03:23 EDT and builds
          # while the 08:23 twin reads 04:23 and skips — also one build.
          # That second case is why the target moved off 02:xx: 01:59 jumps
          # straight to 03:00, so an 02:xx target matched NEITHER twin and
          # the nightly silently skipped a night every spring.
          if [ "$EVENT_NAME" = "schedule" ]; then
            # "23 7 * * *" → "7:23", that cron's UTC instant read on the
            # Eastern clock. A missing or odd cron string is a hard failure,
            # never a skip — a failed gate is what finalize turns into the
            # tracking issue, whereas a quiet skip is exactly how the
            # previous gate went unnoticed for four weeks.
            CRON_UTC=$(printf '%s' "$SCHEDULE" | awk '{print $2 ":" $1}')
            if [[ ! "$CRON_UTC" =~ ^[0-9]{1,2}:[0-9]{1,2}$ ]]; then
              echo "::error::github.event.schedule is '${SCHEDULE}' — cannot tell which twin fired"
              exit 1
            fi
            # Which day's slot? The most recent occurrence at or before now,
            # never today's unconditionally: GitHub starts a run late but
            # never early, so a delay that crosses UTC midnight would read
            # TOMORROW's slot. On a same-offset day both readings agree, so
            # this is invisible 363 nights a year — but on a DST-change day
            # they differ by an hour and that is the whole decision. Worked
            # example: the 03:23 EDT twin of Sat 10-31, started 00:30 UTC on
            # Sun 11-01, reads 11-01 07:23 UTC = 02:23 EST and skips, while
            # the 04:23 EDT twin that must skip reads 03:23 EST and builds.
            # With the on-time twin also skipping, that night builds nothing
            # — the same silent miss this gate was rewritten to end, just
            # twice a year instead of nightly.
            SLOT_UTC=$(date -u -d "$(date -u +%F) ${CRON_UTC} UTC" +%s)
            if [ "$SLOT_UTC" -gt "$(date -u +%s)" ]; then
              SLOT_UTC=$((SLOT_UTC - 86400))
            fi
            SLOT_ET=$(TZ=America/New_York date -d "@$SLOT_UTC" '+%H:%M %Z')
            if [ "${SLOT_ET%%:*}" != "03" ]; then
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              echo "→ cron '${SCHEDULE}' is the ${SLOT_ET} slot, not 03:xx Eastern; skipping (DST twin cron)"
              exit 0
            fi
            echo "→ cron '${SCHEDULE}' is the ${SLOT_ET} slot; run started $(TZ=America/New_York date '+%H:%M %Z')"
          fi

          # ONE source of truth for which images exist. Both the build
          # matrix and the prune job read this, because a hardcoded second
          # copy fails in the worst direction: add an image to the matrix,
          # forget the prune list, and its dated tags accumulate forever
          # with nothing reporting a problem.
          cat > /tmp/images.json <<'IMAGES_EOF'
          [
            {"image": "spatiumddi-api",      "context": "./backend",  "file": "./backend/Dockerfile",  "target": "runtime"},
            {"image": "spatiumddi-frontend", "context": "./frontend", "file": "./frontend/Dockerfile", "target": ""},
            {"image": "dns-bind9",           "context": ".", "file": "./agent/dns/images/bind9/Dockerfile",             "target": ""},
            {"image": "dns-powerdns",        "context": ".", "file": "./agent/dns/images/powerdns/Dockerfile",          "target": ""},
            {"image": "dns-technitium",      "context": ".", "file": "./agent/dns/images/technitium/Dockerfile",        "target": ""},
            {"image": "dns-dnsdist",         "context": ".", "file": "./agent/dns/images/dnsdist/Dockerfile",           "target": ""},
            {"image": "dhcp-kea",            "context": ".", "file": "./agent/dhcp/images/kea/Dockerfile",              "target": ""},
            {"image": "spatium-supervisor",  "context": ".", "file": "./agent/supervisor/images/supervisor/Dockerfile", "target": ""},
            {"image": "looking-glass",       "context": ".", "file": "./agent/looking-glass/images/gobgp/Dockerfile",   "target": ""}
          ]
          IMAGES_EOF
          echo "images=$(jq -c . /tmp/images.json)" >> "$GITHUB_OUTPUT"

          # ── Which evening is this build for? ─────────────────────────
          # The nightly is built at 20:05 America/New_York (by
          # nightly-trigger.yml), and every build from 19:00 one day to
          # 19:00 the next belongs to the evening in between — the stamps
          # use THAT date, not the calendar date the run happens to start
          # on:
          #   - the 03:23 fallback stands in for the evening before it and
          #     is named after it, so the next evening's build never
          #     collides with a fallback's tag;
          #   - a run GitHub started after midnight is late for last
          #     evening, not early for tonight;
          #   - a re-run in the afternoon (dispatch --force) refreshes
          #     last night's release rather than pre-empting tonight's.
          # 19:00 rather than the trigger's own 20:05 so the two never
          # have to agree to the minute: anything the trigger starts is
          # comfortably inside its evening. Eastern throughout, so DST
          # changes the instant and never the date.
          NIGHT_BOUNDARY="19:00"
          NOW=$(date -u +%s)
          TODAY_ET=$(TZ=America/New_York date -d "@$NOW" +%F)
          if [ "$NOW" -lt "$(TZ=America/New_York date -d "${TODAY_ET} ${NIGHT_BOUNDARY}" +%s)" ]; then
            NIGHT_DATE=$(TZ=America/New_York date -d "${TODAY_ET} -1 day" +%Y%m%d)
          else
            NIGHT_DATE=$(TZ=America/New_York date -d "${TODAY_ET}" +%Y%m%d)
          fi
          DATE_TAG="nightly-${NIGHT_DATE}"
          echo "date_tag=${DATE_TAG}" >> "$GITHUB_OUTPUT"
          # Per-night pre-release tag: CalVer date so nightlies sort and
          # read like the releases they sit next to, PREFIXED so it can
          # never match release.yml's bare-CalVer tag trigger (a tag like
          # 2026.08.08-nightly would fire a full release build).
          RELEASE_TAG="nightly-${NIGHT_DATE:0:4}.${NIGHT_DATE:4:2}.${NIGHT_DATE:6:2}"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "→ this is the build for the evening of ${NIGHT_DATE} (${DATE_TAG}, ${RELEASE_TAG}); now $(TZ=America/New_York date -d "@$NOW" '+%F %H:%M %Z')"
          # Informational version string baked into the frontend build and
          # the appliance release stamp. Deliberately NOT CalVer-shaped, so
          # it can never be mistaken for a release by a human or a sort.
          echo "version=0.0.0-${DATE_TAG}+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

          # The last nightly's commit is recorded in the newest dated
          # pre-release's body. One source of truth, and a human can read
          # it. (Falls back to the legacy reused `nightly` release so the
          # first run after this rework still skips an unchanged main.)
          NEWEST_NIGHTLY=$(gh release list --limit 100 \
                             --json tagName,createdAt \
                             --jq '[.[] | select(.tagName | startswith("nightly-"))]
                                   | sort_by(.createdAt) | reverse | .[0].tagName // empty' \
                           2>/dev/null || true)
          NEWEST_NIGHTLY="${NEWEST_NIGHTLY:-nightly}"
          LAST_SHA=$(gh release view "$NEWEST_NIGHTLY" --json body \
                       --jq '.body' 2>/dev/null \
                     | sed -n 's/^built-from: \([0-9a-f]\{40\}\).*/\1/p' | head -1 || true)
          LAST_SHA="${LAST_SHA:-}"
          echo "last_sha=${LAST_SHA}" >> "$GITHUB_OUTPUT"
          echo "last nightly commit: ${LAST_SHA:-<none>}"
          echo "current main commit: ${GITHUB_SHA}"

          # Skip when this evening already has its nightly. The 03:23
          # fallback, and a second dispatch racing the first, must not
          # rebuild an evening that published: the QA lane has walked
          # those bytes, and a same-tag rebuild replaces them under it.
          # "Published" means finalize stamped `built-from:` — a release
          # that exists without it is an evening build that died part-way,
          # and rebuilding that IS the fallback's job. `force` is the
          # explicit way to rebuild a finished evening.
          THIS_EVENING_SHA=$(gh release view "$RELEASE_TAG" --json body --jq '.body' 2>/dev/null                              | sed -n 's/^built-from: \([0-9a-f]\{40\}\).*/\1/p' | head -1 || true)
          if [ "$FORCE" != "true" ] && [ -n "$THIS_EVENING_SHA" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "→ ${RELEASE_TAG} is already published (built-from ${THIS_EVENING_SHA::7}); this evening is done. Skipping — dispatch with force=true to rebuild it"
            exit 0
          fi

          # Skip when main has not moved. Republishing byte-identical images
          # over a quiet weekend burns runner time and, worse, makes the
          # 7-tag ring cover 7 calendar days instead of 7 CHANGED days —
          # which is the thing the ring is for.
          if [ "$FORCE" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "→ forced by dispatch"
          elif [ -n "$LAST_SHA" ] && [ "$LAST_SHA" = "$GITHUB_SHA" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "→ main unchanged since the last nightly; skipping"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi


  # ── Build + push every image release.yml publishes ────────────────────
  # A matrix over IMAGES (never over platforms — see the note in
  # release.yml: a platform matrix pushes each arch to the same tag and the
  # second push overwrites the first, yielding a single-arch image wearing
  # a multi-arch tag).
  images:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.should_build == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # From the gate job, so this list exists exactly once (see there).
        # `target: runtime` on the api image is #732's guard: `dev` is the
        # LAST stage in backend/Dockerfile, so an unpinned build publishes
        # an image carrying pytest + coverage installed as root.
        include: ${{ fromJSON(needs.gate.outputs.images) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event.inputs.dry_run != 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # SCAN BEFORE PUSH. The scan is the gate, so it has to run while
      # refusing to publish is still possible — otherwise `:nightly` (the
      # tag DEVELOPMENT.md tells operators to pull) has already moved to
      # the vulnerable image by the time the job goes red, and with
      # `fail-fast: false` the registry is left holding a mixed set of
      # some-new / some-old images. Cost is one extra amd64 build, which
      # the shared buildx cache makes near-free.
      #
      # APK_SNAPSHOT / APT_SNAPSHOT keep that cache from defeating the
      # scan. BuildKit keys a layer on its command text, so `RUN apk
      # upgrade` (or `apt-get upgrade`) is a cache hit from whenever this
      # scope was last written — the package set of that first build,
      # frozen. A fix the distro publishes afterwards is then never
      # installed but IS flagged by Trivy, and every later night fails on
      # it. Each Dockerfile declares the ARG for its own package manager
      # immediately before that RUN; passing the date tag rebuilds the
      # package layer once a night (everything above it still caches),
      # and passing the SAME value to both builds below makes the push's
      # amd64 half the exact layers the scan saw. An image that declares
      # neither ARG ignores both — which is how the api image went weeks
      # without its apt layer executing (#1088); `make ci`'s Dockerfile
      # guard now refuses a shipped image that declares no snapshot ARG.
      - name: Build amd64 for scanning
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          push: false
          tags: scan-target:${{ matrix.image }}
          # APP_VERSION: the version the supervisor reports (#1183). An
          # image that declares no such ARG ignores it.
          build-args: |
            VITE_APP_VERSION=${{ needs.gate.outputs.version }}
            APP_VERSION=${{ needs.gate.outputs.version }}
            APK_SNAPSHOT=${{ needs.gate.outputs.date_tag }}
            APT_SNAPSHOT=${{ needs.gate.outputs.date_tag }}
          cache-from: type=gha,scope=nightly-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=nightly-${{ matrix.image }}

      # Trivy reports; trivy-gate.sh decides. Trivy's "fixed" means the
      # distro's security database names a fixed version — not that the
      # package is on the mirrors yet, and for Alpine the two diverge by
      # hours after every security commit (secdb updates when the fix is
      # committed to aports; the .apk reaches dl-cdn once the builders and
      # the CDN sync are done). nightly-20260905 died in that window: the
      # frontend's fresh `apk upgrade` at 10:45Z installed every other fix
      # on the mirror, libuuid's arrived there at 13:53Z, and Trivy failed
      # the image on 7 HIGH that nothing could have installed. The gate
      # asks the image's own package index whether each fix is installable
      # today: yes → fail (a rebuild would cure it); not yet → defer,
      # reported as a warning and treated like the unfixed findings
      # `ignore-unfixed` already skips, picked up by the next night's
      # rebuilt package layer. Anything it cannot verify fails, as before.
      - name: Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan-target:${{ matrix.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # The verdict belongs to the gate step; a non-zero exit here
          # would stop the job before it runs.
          exit-code: "0"
          format: json
          output: trivy-${{ matrix.image }}.json

      - name: Gate on the scan
        run: >-
          .github/scripts/trivy-gate.sh
          "trivy-${{ matrix.image }}.json"
          "scan-target:${{ matrix.image }}"

      # Only now, with the scan green, does anything reach the registry.
      # The multi-arch build reuses the cache the scan build just warmed,
      # so the amd64 half is a cache hit.
      - name: Build + push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event.inputs.dry_run != 'true' }}
          # `:nightly` is the mutable pointer; the dated tag is the
          # immutable snapshot the ring keeps.
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:nightly
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ needs.gate.outputs.date_tag }}
          # APP_VERSION: the version the supervisor reports (#1183). An
          # image that declares no such ARG ignores it.
          build-args: |
            VITE_APP_VERSION=${{ needs.gate.outputs.version }}
            APP_VERSION=${{ needs.gate.outputs.version }}
            APK_SNAPSHOT=${{ needs.gate.outputs.date_tag }}
            APT_SNAPSHOT=${{ needs.gate.outputs.date_tag }}
          cache-from: type=gha,scope=nightly-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=nightly-${{ matrix.image }}

  # ── Build the appliance ISO + slot image ──────────────────────────────
  # The same reusable workflow release.yml invokes (#823) — which is the
  # point: this assembly used to run only when a release was cut, so a
  # regression in it sat invisible until the worst moment. image_tag is
  # the immutable dated tag, not `:nightly` — the bake must record which
  # bytes it baked, and the mutable pointer could move under a re-run.
  # Skipped on dry_run: the images job pushed nothing, so there is
  # nothing at the dated tag to bake.
  appliance:
    name: Appliance
    needs: [gate, images]
    if: needs.gate.outputs.should_build == 'true' && github.event.inputs.dry_run != 'true'
    permissions:
      contents: read
      packages: read
    # #1026 — both architectures nightly, so an arm64 regression in the
    # assembly surfaces overnight rather than when a release is cut.
    # That is the whole argument #823 made for the nightly existing.
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    uses: ./.github/workflows/build-appliance.yml
    with:
      version: ${{ needs.gate.outputs.version }}
      image_tag: ${{ needs.gate.outputs.date_tag }}
      arch: ${{ matrix.arch }}
      # The un-versioned spatiumddi-appliance-<arch>.* names are the
      # RELEASE's /releases/latest/download/ link targets; emitting them
      # here would only bloat the artifact with byte-identical copies.
      stable_copies: false
      # The artifact only has to survive the hand-off to appliance-publish.
      artifact_retention_days: 1

  # ── Attach the appliance artifacts to the nightly pre-release ─────────
  appliance-publish:
    name: Attach appliance artifacts
    runs-on: ubuntu-latest
    needs: [gate, appliance]
    if: needs.gate.outputs.should_build == 'true' && github.event.inputs.dry_run != 'true'
    permissions:
      contents: write
    steps:
      - name: Download appliance artifacts (per arch)
        uses: actions/download-artifact@v8
        with:
          # #1026 — one bundle per matrix leg. A bare ``name:`` of the
          # old value matches nothing and download-artifact ERRORS.
          pattern: appliance-artifacts-*
          merge-multiple: true
          path: dist/
      - name: Upload to tonight's pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}  # no checkout in this job
          DATE_TAG: ${{ needs.gate.outputs.date_tag }}
          RELEASE_TAG: ${{ needs.gate.outputs.release_tag }}
        run: |
          set -euo pipefail
          # One pre-release PER night (see the header) — the build's dated
          # asset names ship as-is; no rename, no replace-in-place. The
          # prune-releases job bounds the ring to the trailing 7 days.
          # #1026 — one triplet PER ARCHITECTURE. The ISO name gained
          # its arch (it had none while the stable name always did, which
          # collides the moment there are two build legs), and the two
          # hardcoded ``-amd64`` lines below meant arm64 was built every
          # night and published never.
          #
          # Every expected file is still asserted present: a nightly that
          # quietly attaches one architecture is the regression this job
          # exists to catch, one artifact later.
          ARCHES="amd64 arm64"
          UPLOAD=()
          for arch in $ARCHES; do
            ISO="dist/spatiumddi-appliance-${DATE_TAG}-${arch}.iso"
            XZ="dist/spatiumddi-appliance-slot-${DATE_TAG}-${arch}.raw.xz"
            SHA="dist/spatiumddi-appliance-slot-${DATE_TAG}-${arch}.sha256"
            for f in "$ISO" "$XZ" "$SHA"; do
              [ -f "$f" ] || { echo "✗ expected $f"; ls -l dist/; exit 1; }
            done
            UPLOAD+=("$ISO" "$XZ" "$SHA")
          done
          ls -lh dist/

          # --target pins the tag to the exact commit this run built.
          # `nightly-YYYY.MM.DD` cannot match release.yml's bare-CalVer
          # trigger, so creating the tag fires nothing. Finalize fills in
          # the real notes once every job has succeeded.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Nightly ${RELEASE_TAG#nightly-}" \
              --prerelease --notes "build in progress"
          fi
          # --clobber keeps a same-day re-run (dispatch --force) idempotent.
          gh release upload "$RELEASE_TAG" --clobber "${UPLOAD[@]}"

  # ── Prune the dated tag ring ──────────────────────────────────────────
  prune:
    name: Prune old nightly tags
    runs-on: ubuntu-latest
    needs: [gate, images]
    if: needs.gate.outputs.should_build == 'true' && github.event.inputs.dry_run != 'true'
    permissions:
      packages: write
    steps:
      - name: Keep the newest 7 dated tags per image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          IMAGES_JSON: ${{ needs.gate.outputs.images }}
        run: |
          set -euo pipefail
          KEEP=7
          # Same list the build matrix used — see the gate job.
          IMAGES=$(printf '%s' "$IMAGES_JSON" | jq -r '.[].image')

          failures=0
          for img in $IMAGES; do
            echo "── $img"
            # A version is a prune candidate ONLY when every tag it carries
            # is a dated nightly tag. That is what protects `latest`, the
            # CalVer release tags, and the `:nightly` pointer — the pointer
            # shares a version with the newest dated tag, which the sort
            # keeps anyway, but the all-tags-match rule means we would never
            # delete it even if it did not.
            #
            # UNTAGGED versions are deliberately left alone, and this is a
            # real limitation rather than an oversight. A multi-arch push
            # creates one untagged child manifest per platform plus a
            # provenance attestation, all referenced BY the tagged manifest
            # — deleting them by "is it untagged" would break the very tags
            # this job is protecting. Working out which untagged versions
            # are orphaned by a prune means resolving each manifest's
            # references, which is more machinery than the problem deserves
            # here.
            #
            # So what is bounded is the TAG ring, not total storage: the
            # children of pruned manifests become orphaned garbage. GHCR's
            # own "delete untagged versions" retention policy is the right
            # tool for that and is configured on the package, not here.
            # Distinguish "no candidates" from "the API call failed". A
            # silently-empty list would print "nothing to prune" and read as
            # success while the ring grew without bound — the same
            # silence-as-success failure this whole workflow exists to catch.
            if ! raw=$(gh api --paginate \
              "/orgs/${OWNER}/packages/container/${img}/versions" 2>&1); then
              echo "   ! could not list versions — skipping (is ${OWNER} an org?)"
              echo "     ${raw}" | head -3
              continue
            fi
            versions=$(printf '%s' "$raw" | jq -r '.[] | select(
                      (.metadata.container.tags | length) > 0 and
                      (.metadata.container.tags | all(test("^nightly-[0-9]{8}$")))
                    ) | "\(.created_at)\t\(.id)\t\(.metadata.container.tags | join(","))"' \
              | sort -r)

            total=$(printf '%s' "$versions" | grep -c . || true)
            if [ "${total:-0}" -le "$KEEP" ]; then
              echo "   ${total:-0} dated tag(s) — nothing to prune"
              continue
            fi
            echo "   ${total} dated tag(s) — pruning $((total - KEEP))"

            # Failures are COUNTED, not just logged. A prune that 403s every
            # night (GITHUB_TOKEN without delete:packages, say) would
            # otherwise report green forever while the ring grew without
            # bound — the same silence-as-success this job's list branch
            # already guards against. Counted in a file because the loop
            # body runs in a subshell.
            : > /tmp/prune-failures
            printf '%s\n' "$versions" | tail -n +$((KEEP + 1)) | while IFS=$'\t' read -r created id tags; do
              [ -n "$id" ] || continue
              echo "   deleting $tags (created $created)"
              if ! err=$(gh api -X DELETE \
                   "/orgs/${OWNER}/packages/container/${img}/versions/${id}" 2>&1); then
                echo "   ! delete FAILED for ${tags}: $(printf '%s' "$err" | head -1)"
                echo "x" >> /tmp/prune-failures
              fi
            done
            failures=$((failures + $(wc -l < /tmp/prune-failures)))
          done

          if [ "$failures" -gt 0 ]; then
            echo "::error::${failures} prune operation(s) failed — the dated-tag"
            echo "::error::ring is NOT bounded until this is fixed."
            exit 1
          fi

  # ── Prune the nightly pre-release ring (releases + git tags) ──────────
  prune-releases:
    name: Prune old nightly pre-releases
    runs-on: ubuntu-latest
    needs: [gate, appliance-publish]
    if: needs.gate.outputs.should_build == 'true' && github.event.inputs.dry_run != 'true'
    permissions:
      contents: write
    steps:
      - name: Delete nightly pre-releases older than 7 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}  # no checkout in this job
        run: |
          set -euo pipefail
          # The ring is keyed on the DATE IN THE TAG, not createdAt — a
          # late manual re-run of an old day must not rejuvenate it. The
          # cutoff is 7 Eastern calendar days, matching the tag's own
          # calendar (see the gate job).
          CUTOFF=$(TZ=America/New_York date -d '7 days ago' +%Y%m%d)
          echo "cutoff: nightly dates < ${CUTOFF} are deleted"

          # startswith("nightly"), no dash — the legacy reused release is
          # tagged bare `nightly` and must enter the loop to be deleted;
          # anything else oddly-named lands in the fail-safe skip below.
          if ! tags=$(gh release list --limit 200 --json tagName \
                        --jq '.[].tagName | select(startswith("nightly"))'); then
            echo "::error::could not list releases — retention NOT applied"
            exit 1
          fi

          failures=0
          for tag in $tags; do
            # Legacy single reused pre-release from the pre-rework design —
            # superseded by the dated ring; delete on sight.
            if [ "$tag" = "nightly" ]; then
              echo "deleting legacy reused release: $tag"
              gh release delete "$tag" --yes --cleanup-tag || failures=$((failures + 1))
              continue
            fi
            # nightly-YYYY.MM.DD → YYYYMMDD. Anything not matching the
            # dated shape is left alone (fail-safe: never delete what we
            # can't positively date).
            d=$(printf '%s' "$tag" | sed -n 's/^nightly-\([0-9]\{4\}\)\.\([0-9]\{2\}\)\.\([0-9]\{2\}\)$/\1\2\3/p')
            [ -n "$d" ] || { echo "skipping unrecognized tag shape: $tag"; continue; }
            if [ "$d" -lt "$CUTOFF" ]; then
              echo "deleting ${tag} (older than 7 days)"
              # --cleanup-tag removes the git tag too — without it the tag
              # list grows one orphan per night forever.
              gh release delete "$tag" --yes --cleanup-tag || failures=$((failures + 1))
            else
              echo "keeping  ${tag}"
            fi
          done

          # Counted, not just logged — a retention sweep that 403s every
          # night would otherwise report green while releases accumulated
          # 1.5 GB/day (same silence-as-success rule as the tag prune).
          if [ "$failures" -gt 0 ]; then
            echo "::error::${failures} release deletion(s) failed — the nightly release ring is NOT bounded until this is fixed."
            exit 1
          fi

  # ── Record what was built, and make a failure impossible to miss ──────
  finalize:
    name: Finalize
    runs-on: ubuntu-latest
    needs: [gate, images, appliance, appliance-publish, prune, prune-releases]
    # `always()`, and NOT gated on `should_build` alone: a gate job that
    # FAILS emits no outputs at all, so that condition would be false and
    # this job would be skipped — the nightly would die without opening the
    # tracking issue that is the only reason anyone finds out. Run whenever
    # the gate didn't cleanly decide to skip.
    if: always() && needs.gate.result != 'skipped' && needs.gate.outputs.should_build != 'false'
    permissions:
      contents: write
      issues: write
    steps:
      - name: Update the nightly pre-release record
        # Appliance success is required too: `built-from:` is what makes the
        # next run skip when main hasn't moved, so stamping it after a
        # failed appliance build would leave the assets stale (or missing)
        # with no retry until the next commit lands.
        if: >-
          needs.images.result == 'success' &&
          needs.appliance.result == 'success' &&
          needs['appliance-publish'].result == 'success' &&
          github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job has no checkout, so `gh` cannot infer the repo from git
          # remotes — without GH_REPO every call dies with "not a git
          # repository" (which is how the first nightly failed to report
          # its own failure).
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RELEASE_TAG='${{ needs.gate.outputs.release_tag }}'
          # appliance-publish created it; recreate defensively if a manual
          # cleanup raced this run.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" \
              --title "Nightly ${RELEASE_TAG#nightly-}" --prerelease --notes "init"
          fi
          # `built-from:` is parsed by the gate job on the next run. Keep the
          # 40-hex shape; the sed there anchors on it.
          gh release edit "$RELEASE_TAG" --notes "$(cat <<EOF
          Automated nightly build of \`main\`. **Not a release** — no support, no upgrade path.

          built-from: ${GITHUB_SHA}
          date-tag: ${{ needs.gate.outputs.date_tag }}

          Pull the images:
          \`\`\`
          docker pull ghcr.io/${{ github.repository_owner }}/spatiumddi-api:nightly
          \`\`\`
          The dated tag \`${{ needs.gate.outputs.date_tag }}\` pins this exact build;
          the newest 7 are kept.

          The appliance ISO and slot upgrade image (+ \`.sha256\`) for this exact
          build are attached below. Nightly pre-releases older than 7 days are
          deleted automatically.
          EOF
          )"

      - name: Open or update a tracking issue on failure
        # A nightly that fails silently is worth nothing — that is the whole
        # reason for a scheduled build. One issue, reused, so a broken week
        # doesn't open seven.
        # #1094 — the dry-run guard every sibling side-effecting step
        # carries, and which this one did not. A dry run publishes
        # nothing and prunes nothing, so a dry run that FAILS means a
        # candidate build failed — the dry run doing its job — not that
        # the nightly is broken. Filing that on the reused tracker
        # re-opens it for a build that is fine and points whoever picks
        # it up at the wrong branch.
        if: >-
          github.event.inputs.dry_run != 'true' && (
            needs.gate.result == 'failure' ||
            needs.images.result == 'failure' ||
            needs.appliance.result == 'failure' ||
            needs['appliance-publish'].result == 'failure' ||
            needs.prune.result == 'failure' ||
            needs['prune-releases'].result == 'failure'
          )
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}  # no checkout in this job — see above
        run: |
          set -euo pipefail
          TITLE="Nightly build failing"
          BODY="Nightly build failed on \`${GITHUB_REF_NAME}\` @ \`${GITHUB_SHA::12}\`.

          - gate: ${{ needs.gate.result }}
          - images: ${{ needs.images.result }}
          - appliance: ${{ needs.appliance.result }}
          - appliance-publish: ${{ needs['appliance-publish'].result }}
          - prune: ${{ needs.prune.result }}
          - prune-releases: ${{ needs['prune-releases'].result }}

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          This issue is reused by every failing nightly — close it once the
          build is green again."
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
                       --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "${EXISTING:-}" ] && [ "${EXISTING}" != "null" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "area:ops" || \
              gh issue create --title "$TITLE" --body "$BODY"
          fi
