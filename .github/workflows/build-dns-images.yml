name: Build DNS Agent Images

# TRIGGERS — deliberately PR-only. Neither `push` case earned its keep:
#
#   on a TAG, this raced release.yml's build-dns / build-dns-powerdns / build-dns-technitium / build-dns-dnsdist,
#     which builds the same image and pushes the SAME `:<VERSION>` tag.
#     Two multi-arch builds of identical source, concurrently, with the
#     winner decided by whichever finished last — on a release artifact.
#
#   on `main`, it published `:main` and `:sha-<short>` that nothing
#     consumes: no chart, no compose file, no k8s manifest pins them, and
#     agent-e2e explicitly builds from PR source instead (see the comment
#     in agent-e2e.yml). It also skipped Trivy on that path, so it was
#     publishing unscanned multi-arch images for no reader.
#
# What replaced each: releases are built by release.yml, and "build main
# periodically" is nightly.yml (#805) — which does it once a day with a
# Trivy gate ahead of the push, rather than on every merge with none.
#
# The PR trigger below is the one that matters and is unchanged: it is the
# CVE gate, and it still blocks the PR on any fixable HIGH/CRITICAL.
on:
  pull_request:
    paths:
      - "agent/dns/**"
      # #1093 — the workflow itself, so a change to how this lane
      # BUILDS or SCANS is exercised by the lane. Without it, the
      # PR that rewired this gate ran none of these jobs: the one
      # change guaranteed to need the proof was the one change that
      # could not get it.
      - ".github/workflows/build-dns-images.yml"
  workflow_dispatch:

# Read-only (#1022): this workflow builds and scans, it never publishes.
# Publishing is release.yml (tags, multi-arch) and nightly.yml (main).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # dnsdist (#146 Phase 2) and technitium follow the same image path
        # convention (agent/dns/images/<flavor>/Dockerfile →
        # ghcr.io/spatiumnorth/dns-<flavor>).
        flavor: [bind9, powerdns, technitium, dnsdist]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # #1022 — this used to be one of two build steps, the other a multi-arch
      # push gated on ``event_name != 'pull_request'``. The triggers are PR +
      # workflow_dispatch only (see docs/DEVELOPMENT.md, trigger policy), so that
      # step was reachable solely by hand and pushed ``:<branch>`` / ``:sha-*``
      # tags nothing consumes. release.yml and nightly.yml own publishing.

      # #1093 — bust the package layer once a week. BuildKit keys a layer on
      # its RUN text, so the ``type=gha`` cache below serves this image's
      # ``apk upgrade`` / ``apt-get upgrade`` — package set included — from
      # whenever this scope was first written. A PR scan of that layer is
      # wrong in BOTH directions: it misses a CVE the current index would
      # flag, and it keeps reporting one that was fixed weeks ago. Weekly
      # rather than daily: daily would defeat caching for no extra signal.
      - name: Compute package snapshot key
        id: snap
        run: echo "snapshot=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Build (single-arch, load locally for Trivy)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: agent/dns/images/${{ matrix.flavor }}/Dockerfile
          # Single-arch: ``--load`` only accepts one platform, and the
          # runner is amd64, so this is what fits in the local docker
          # daemon. release.yml and nightly.yml build the multi-arch
          # manifest lists.
          platforms: linux/amd64
          push: false
          load: true
          tags: ghcr.io/spatiumnorth/dns-${{ matrix.flavor }}:pr-scan
          build-args: |
            APK_SNAPSHOT=${{ steps.snap.outputs.snapshot }}
            APT_SNAPSHOT=${{ steps.snap.outputs.snapshot }}
          cache-from: type=gha,scope=dns-${{ matrix.flavor }}
          cache-to: type=gha,mode=max,scope=dns-${{ matrix.flavor }}

      # Issue #734 — the only automated proof that a zone transfer is
      # permitted for a TSIG-signed request and refused for everything
      # else. It runs against the image just built, so it exercises the
      # real agent renderer and the real pinned BIND together on a socket;
      # a unit test can only show we emit the string we intended, not that
      # named reads it the way we believe.
      #
      # It lives here rather than in agent-e2e.yml because this job already
      # loads the image locally for Trivy, and because the kind workflow
      # only ever ran a `dig version.bind CH TXT` liveness smoke. Before
      # this step, `grep -rl axfr .github/workflows` matched NOTHING, while
      # test_acceptance.py's AXFR test was a permanent skip whose docstring
      # claimed coverage lived in agent-e2e.yml. That false claim is a large
      # part of why #61's drift report shipped broken and stayed broken.
      #
      # The script never skips: a missing prerequisite exits non-zero,
      # because "the check quietly didn't run" is the failure being fixed.
      - name: TSIG zone-transfer check (bind9)
        if: matrix.flavor == 'bind9'
        run: |
          docker run --rm \
            -v "$PWD/agent/dns/tests:/checks:ro" \
            --entrypoint python3 \
            ghcr.io/spatiumnorth/dns-bind9:pr-scan /checks/live_axfr_check.py

      # Issue #2249 — toggling query / response logging on a RUNNING named,
      # through the agent's real render + reload path. `rndc reconfig`
      # applies neither switch, so this is the only proof the explicit
      # `rndc querylog|responselog on|off` after each reload took effect;
      # asserted on `rndc status` and on the lines named writes. Runs as
      # `spatium`, like the agent: named started as root drops the
      # capabilities it would need to write the spatium-owned directories.
      - name: Query-logging toggle check (bind9)
        if: matrix.flavor == 'bind9'
        run: |
          docker run --rm --user spatium \
            -v "$PWD/agent/dns/tests:/checks:ro" \
            --entrypoint python3 \
            ghcr.io/spatiumnorth/dns-bind9:pr-scan /checks/live_query_log_check.py

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # Reference the locally-loaded image from the PR build
          # step above. Previously this referenced
          # ``ghcr.io/...:${{ github.sha }}`` which is never produced
          # — metadata-action emits ``sha-<short>``-prefixed tags,
          # not raw full SHAs, and on PR the image isn't pushed at
          # all. Trivy resolved the missing tag against ghcr and
          # blew up with MANIFEST_UNKNOWN.
          image-ref: ghcr.io/spatiumnorth/dns-${{ matrix.flavor }}:pr-scan
          format: json
          output: trivy-report.json
          severity: HIGH,CRITICAL
          # The verdict belongs to the gate step below; a non-zero exit
          # here would stop the job before it runs. `ignore-unfixed`
          # still drops vulns with no upstream patch at all.
          exit-code: "0"
          ignore-unfixed: true

      # #1093 — the gate, not Trivy's own exit code. Trivy's "fixed" means
      # the distro's security database names a fix, NOT that the package is
      # on the mirrors yet; for Alpine the two diverge by hours after every
      # security commit. A bare ``exit-code: 1`` therefore fails the PR on
      # findings nothing could have installed — the nightly-20260905 failure,
      # relocated to a lane that blocks unrelated work. The gate asks the
      # image's own package index whether each fix is installable today:
      # yes -> fail, not yet -> defer with a warning. Anything it cannot
      # verify still fails.
      - name: Gate on the scan
        run: >-
          .github/scripts/trivy-gate.sh
          "trivy-report.json"
          "ghcr.io/spatiumnorth/dns-${{ matrix.flavor }}:pr-scan"
