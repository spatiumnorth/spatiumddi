name: Build DHCP Agent Images

# TRIGGERS — deliberately PR-only. Neither `push` case earned its keep:
#
#   on a TAG, this raced release.yml's build-dhcp,
#     which builds the same image and pushes the SAME `:<VERSION>` tag.
#     Two multi-arch builds of identical source, concurrently, with the
#     winner decided by whichever finished last — on a release artifact.
#
#   on `main`, it published `:main` and `:sha-<short>` that nothing
#     consumes: no chart, no compose file, no k8s manifest pins them, and
#     agent-e2e explicitly builds from PR source instead (see the comment
#     in agent-e2e.yml). It also skipped Trivy on that path, so it was
#     publishing unscanned multi-arch images for no reader.
#
# What replaced each: releases are built by release.yml, and "build main
# periodically" is nightly.yml (#805) — which does it once a day with a
# Trivy gate ahead of the push, rather than on every merge with none.
#
# The PR trigger below is the one that matters and is unchanged: it is the
# CVE gate, and it still blocks the PR on any fixable HIGH/CRITICAL.
on:
  pull_request:
    paths:
      - "agent/dhcp/**"
      # #1093 — the workflow itself, so a change to how this lane
      # BUILDS or SCANS is exercised by the lane. Without it, the
      # PR that rewired this gate ran none of these jobs: the one
      # change guaranteed to need the proof was the one change that
      # could not get it.
      - ".github/workflows/build-dhcp-images.yml"
      # #3464 — the shared Trivy install step this lane scans with.
      - ".github/actions/install-trivy/**"
  workflow_dispatch:

# Read-only (#1022): this workflow builds and scans, it never publishes.
# Publishing is release.yml (tags, multi-arch) and nightly.yml (main).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [kea]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # #1022 — this used to be one of two build steps, the other a multi-arch
      # push gated on ``event_name != 'pull_request'``. The triggers are PR +
      # workflow_dispatch only (see docs/DEVELOPMENT.md, trigger policy), so that
      # step was reachable solely by hand and pushed ``:<branch>`` / ``:sha-*``
      # tags nothing consumes. release.yml and nightly.yml own publishing.

      # #1093 — bust the package layer once a week. BuildKit keys a layer on
      # its RUN text, so the ``type=gha`` cache below serves this image's
      # ``apk upgrade`` / ``apt-get upgrade`` — package set included — from
      # whenever this scope was first written. A PR scan of that layer is
      # wrong in BOTH directions: it misses a CVE the current index would
      # flag, and it keeps reporting one that was fixed weeks ago. Weekly
      # rather than daily: daily would defeat caching for no extra signal.
      - name: Compute package snapshot key
        id: snap
        run: echo "snapshot=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Build (single-arch, load locally for Trivy)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: agent/dhcp/images/${{ matrix.flavor }}/Dockerfile
          # Single-arch on PR: ``--load`` only accepts one platform,
          # and the runner is amd64. Release builds (push branch) do
          # the multi-arch manifest list.
          platforms: linux/amd64
          push: false
          load: true
          tags: ghcr.io/spatiumnorth/dhcp-${{ matrix.flavor }}:pr-scan
          build-args: |
            APK_SNAPSHOT=${{ steps.snap.outputs.snapshot }}
            APT_SNAPSHOT=${{ steps.snap.outputs.snapshot }}
          cache-from: type=gha,scope=dhcp-${{ matrix.flavor }}
          cache-to: type=gha,mode=max,scope=dhcp-${{ matrix.flavor }}

      # get.trivy.dev, which trivy-action's own setup downloads from,
      # is gone (#3464): install from the GitHub release instead.
      - name: Install Trivy
        uses: ./.github/actions/install-trivy

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          skip-setup-trivy: true
          # Reference the locally-loaded image from the PR build
          # step above. Same fix as build-dns-images.yml — the
          # previous ``ghcr.io/...:${{ github.sha }}`` reference
          # never resolved (metadata-action emits ``sha-<short>``,
          # not raw full SHAs, and on PR nothing gets pushed) so
          # Trivy 404'd with MANIFEST_UNKNOWN.
          image-ref: ghcr.io/spatiumnorth/dhcp-${{ matrix.flavor }}:pr-scan
          format: json
          output: trivy-report.json
          severity: HIGH,CRITICAL
          # The verdict belongs to the gate step below; a non-zero exit
          # here would stop the job before it runs. `ignore-unfixed`
          # still drops vulns with no upstream patch at all.
          exit-code: "0"
          ignore-unfixed: true

      # #1093 — the gate, not Trivy's own exit code. Trivy's "fixed" means
      # the distro's security database names a fix, NOT that the package is
      # on the mirrors yet; for Alpine the two diverge by hours after every
      # security commit. A bare ``exit-code: 1`` therefore fails the PR on
      # findings nothing could have installed — the nightly-20260905 failure,
      # relocated to a lane that blocks unrelated work. The gate asks the
      # image's own package index whether each fix is installable today:
      # yes -> fail, not yet -> defer with a warning. Anything it cannot
      # verify still fails.
      - name: Gate on the scan
        run: >-
          .github/scripts/trivy-gate.sh
          "trivy-report.json"
          "ghcr.io/spatiumnorth/dhcp-${{ matrix.flavor }}:pr-scan"
