name: Build appliance builder image

# The OS-appliance build container. Bumping mkosi or any of the tools
# under `appliance/builder/Dockerfile` republishes the image at
# ghcr.io/spatiumnorth/appliance-builder:latest, which is what
# `make appliance` (laptop) and the release pipeline (CI) both pull.

on:
  push:
    branches: [main]
    paths:
      - 'appliance/builder/**'
      - '.github/workflows/build-appliance-builder.yml'
  pull_request:
    paths:
      - 'appliance/builder/**'
      - '.github/workflows/build-appliance-builder.yml'
  workflow_dispatch:

# Read-only by default (#1334); the one job that pushes raises its own.
permissions:
  contents: read

jobs:
  build-and-publish:
    # Forks inherit this workflow (#830); never push the builder image
    # outside the canonical repo. PRs to us run here anyway (the base
    # repo's owner matches), so contributor scan builds are unaffected.
    if: github.repository_owner == 'spatiumnorth'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Required now that this builds two architectures on an amd64
      # runner: without a registered binfmt handler for aarch64, BuildKit
      # cannot execute the arm64 leg's RUN layers at all. Every other
      # multi-arch build in this repo pairs these two the same way.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (PR) / Build + push (main)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: appliance/builder
          push: ${{ github.event_name != 'pull_request' }}
          # NOT ``load`` on the PR path any more. buildx's docker
          # exporter cannot export a manifest list, so ``--load`` with two
          # platforms fails outright ("docker exporter does not currently
          # support exporting manifest lists") — the single-platform pin
          # this step used to carry was the invariant that made it legal.
          # A PR build therefore just builds (into the cache) and pushes
          # nothing, which is all the pre-merge check ever needed.
          load: false
          tags: |
            ghcr.io/spatiumnorth/appliance-builder:latest
          # Both, since #991. The appliance ISO is x86-64 and mkosi
          # cross-builds it happily, but the builder itself cannot be
          # EMULATED: under qemu-user / Rosetta mkosi dies immediately on
          # mount_setattr(2) ("Function not implemented"), which the
          # syscall translation layers do not implement and --privileged
          # does not fix. So an arm64 developer needs a NATIVE arm64
          # builder, and this is where it comes from.
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
