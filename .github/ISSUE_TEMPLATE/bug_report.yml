name: Bug report
description: Something is broken or behaves incorrectly
title: "[bug] "
labels: ["bug"]
# New issues are added to the org project by its auto-add workflow and land in
# Status "Triage" there; see the "Issue tracking" section of CLAUDE.md.
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill in as much as you can — it saves a round trip.

  - type: input
    id: version
    attributes:
      label: SpatiumDDI version
      description: "Git tag, image tag, or short commit SHA"
      placeholder: "e.g. 2026.04.16-1 or ghcr.io/spatiumnorth/api:2026.04.16-2"
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Docker Compose
        - Kubernetes (Helm)
        - Kubernetes (manifests)
        - Bare metal / systemd
        - OS appliance
        - Local dev (make dev)
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - IPAM
        - DNS
        - DHCP
        - Auth (local / LDAP / OIDC / SAML / RADIUS / TACACS+)
        - Permissions / RBAC
        - Audit / Observability
        - Frontend / UI
        - API
        - Migrations / DB
        - Docs
        - Other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / tracebacks
      description: API, worker, or browser console logs. Please redact secrets.
      render: shell

  - type: markdown
    attributes:
      value: |
        ### Support bundle (optional, but it saves a round trip)

        **Diagnostics → Support bundle** generates a scrubbed archive with
        versions, schema head, recent errors, alert history, configuration
        shape and an audit tail. IP addresses, hostnames, MAC addresses and
        usernames are replaced with stable synthetic values; credentials are
        excluded outright.

        ⚠️ **Attachments on this repository are public.** Anyone who can read
        this issue can download what you attach, and deleting the comment does
        not reliably remove the file. Scrubbing is best-effort — please use the
        preview screen to review the bundle before attaching it, and never
        attach the `-UNSCRUBBED-` variant or the decode map.

  - type: checkboxes
    id: bundle_ack
    attributes:
      label: If you are attaching a support bundle
      options:
        - label: I generated it with scrubbing on (the filename does NOT contain UNSCRUBBED)
          required: false
        - label: I reviewed the preview before attaching it
          required: false

  - type: textarea
    id: env
    attributes:
      label: Environment details
      description: PostgreSQL version, Redis version, reverse proxy, auth provider type, etc.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I am running a recent SpatiumDDI release (within the last ~2 releases)
          required: false
