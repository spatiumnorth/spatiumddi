name: Feature request
description: Suggest a new feature or enhancement
title: "[feat] "
labels: ["idea"]
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. To talk it through before filing, or to ask a
        question, use [Discussions](https://github.com/spatiumnorth/spatiumddi/discussions).

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - IPAM
        - DNS
        - DHCP
        - Discovery (sweeps, SNMP, LLDP, nmap)
        - Auth / Providers
        - Permissions / RBAC
        - Alerts / notifications / audit forwarding
        - Audit log / observability
        - Backup / restore
        - Reporting / dashboards
        - Integrations (Kubernetes, Proxmox, firewalls, cloud, …)
        - Operator Copilot / MCP
        - Appliance (OS, install, upgrade, Fleet)
        - Deployment (Compose / Helm / manifests)
        - Frontend / UI
        - API / CLI
        - Docs
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the user or workflow pain. Feature requests with a clear motivation get prioritized faster.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it behave? Include API shape, UI sketch, or CLI syntax if useful.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds exist today? Why aren't they enough? How do other DDI tools handle it?

  - type: textarea
    id: context
    attributes:
      label: Your environment
      description: Roughly how big is the estate (subnets, zones, scopes, nodes), and how is SpatiumDDI deployed? It helps us judge the design.

  - type: checkboxes
    id: contribution
    attributes:
      label: Would you be willing to help?
      options:
        - label: I'd be open to submitting a PR for this
        - label: I can help test a prototype
