# PostgreSQL HA via CloudNativePG operator
# Install operator first: https://cloudnative-pg.io/documentation/current/installation_upgrade/
#   kubectl apply --server-side -f \
#     https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.24/releases/cnpg-1.24.0.yaml
#
# This creates a 3-node PostgreSQL cluster with:
# - 1 primary (read/write)  → DNS: postgres-rw.spatiumddi.svc
# - 2 replicas (read-only)  → DNS: postgres-ro.spatiumddi.svc
#   (CNPG names the Services after the Cluster, `postgres`:
#   postgres-rw / postgres-ro / postgres-r. There are no
#   postgres-primary / postgres-replica Services — #1547.)
# - Continuous WAL archiving to a PVC
# - Automatic failover via CloudNativePG
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: spatiumddi
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16

  # #2831: how CNPG updates the PRIMARY once a change has rolled the
  # replicas (a new image, a resources change, a parameter that needs a
  # restart, or `kubectl cnpg restart`). `switchover` promotes an
  # already-updated replica first and fast-shuts the old primary, so a new
  # connection waits seconds. CNPG's own default, `restart`, restarts the
  # primary (in place, or by deleting its pod) while it still serves: its
  # smart shutdown turns every new connection away for the whole
  # `smartShutdownTimeout` (180 s), because the services' pooled sessions
  # never end on their own. Not part of the instance pods' spec, so adding
  # it rolls nothing.
  #
  # CNPG's admission webhook refuses an update that changes `imageName` and
  # any `postgresql.parameters` key together. Operator 1.24 (up to 1.27)
  # refuses it whatever the method, 1.28 and later only under `switchover`:
  # move the image in one apply and the parameters in another.
  primaryUpdateMethod: switchover

  # #983 — CNPG owns the instance pods, so the seccomp profile is a field on
  # the Cluster rather than a pod-template securityContext. The CRD already
  # defaults it to RuntimeDefault; stating it makes the posture readable
  # here instead of only in the operator's source.
  seccompProfile:
    type: RuntimeDefault

  # #590 — spread the instances one per node. CNPG enables anti-affinity by
  # default but only as `preferred` (best effort), which lets two of three
  # instances land on the same node — one node loss then takes the primary
  # AND a replica together. `required` forces one per node; it cannot
  # deadlock an update, because CNPG replaces an instance in place (same pod
  # name, same PVC) rather than surging a second copy beside it.
  #
  # Set this back to `preferred` if you run more instances than nodes.
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname

  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "256MB"
      work_mem: "16MB"
      # #2132 — WAL kept for a former primary to pg_rewind and rejoin after
      # a failover (CNPG's default is 512MB). #2317 — the most WAL a
      # replication slot may hold back; PostgreSQL's default (-1) lets a
      # slot for a standby that never follows a new primary fill the
      # volume. pg_wal stays near max(wal_keep_size, max_slot_wal_keep_size)
      # + max_wal_size (1GB) = 4GB, well inside the 20Gi below. Same values
      # as the umbrella chart's postgresql.cnpg.parameters.
      wal_keep_size: "2GB"
      max_slot_wal_keep_size: "3GB"

  bootstrap:
    initdb:
      database: spatiumddi
      owner: spatiumddi
      secret:
        name: spatiumddi-postgres-credentials

  storage:
    size: 20Gi
    storageClass: standard  # replace with your storage class

  monitoring:
    enablePodMonitor: true  # requires Prometheus Operator

  backup:
    barmanObjectStore:
      # Uncomment and configure for S3/GCS/Azure backup:
      # destinationPath: s3://your-bucket/spatiumddi/wal
      # s3Credentials:
      #   accessKeyId:
      #     name: s3-credentials
      #     key: ACCESS_KEY_ID
      #   secretAccessKey:
      #     name: s3-credentials
      #     key: SECRET_ACCESS_KEY
    retentionPolicy: "30d"
---
# Credentials secret for CloudNativePG bootstrap
apiVersion: v1
kind: Secret
metadata:
  name: spatiumddi-postgres-credentials
  namespace: spatiumddi
type: kubernetes.io/basic-auth
stringData:
  username: spatiumddi
  password: "CHANGEME"  # match spatiumddi-secrets postgres-password
