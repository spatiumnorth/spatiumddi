apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: spatiumddi
  labels:
    app.kubernetes.io/name: spatiumddi
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spatiumddi-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: spatiumddi-api
        app.kubernetes.io/component: api
    spec:
      # #983 — Kubernetes runs a container ``Unconfined`` unless a profile is
      # asked for, while docker-compose applies the runtime's default profile
      # to every service. Without this the same image runs with FEWER syscall
      # restrictions here than under Compose.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # #590 — spread replicas across nodes so a single node loss can't
      # take every replica of this workload with it. Soft (preferred): a
      # single-node or replicas>nodes cluster must still schedule. The
      # Helm chart's appliance path uses required anti-affinity, where the
      # replica count tracks the control-plane node count exactly.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: spatiumddi-api
                topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: ghcr.io/spatiumnorth/spatiumddi-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spatiumddi-secrets
                  key: postgres-password
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: spatiumddi-secrets
                  key: secret-key
            # #1159 — /metrics scrape token. Optional: without it only API
            # tokens can scrape.
            - name: PROMETHEUS_METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: spatiumddi-secrets
                  key: metrics-token
                  optional: true
            - name: DATABASE_URL
              value: "postgresql+asyncpg://spatiumddi:$(POSTGRES_PASSWORD)@postgres-rw:5432/spatiumddi"
            # #1547 — Redis password from the Secret, interpolated into
            # the sentinel:// URLs below. The URLs cannot live in the
            # ConfigMap: interpolation only expands in an env `value`,
            # and a ConfigMap must never carry a credential. Same
            # wiring as the umbrella chart's commonEnv. REDIS_URL
            # lists every Sentinel by its per-pod headless DNS name so
            # one is reachable mid-failover; the Celery URLs go through
            # the `redis-sentinel` Service (backend/app/core/
            # redis_client.py, backend/app/celery_app.py).
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spatiumddi-secrets
                  key: redis-password
            - name: REDIS_SENTINEL_MASTER
              valueFrom:
                configMapKeyRef:
                  name: spatiumddi-config
                  key: REDIS_SENTINEL_MASTER
            # The password the Sentinels themselves require (the data
            # password) — settings.redis_sentinel_password.
            - name: REDIS_SENTINEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spatiumddi-secrets
                  key: redis-password
            - name: REDIS_URL
              value: "sentinel://:$(REDIS_PASSWORD)@redis-0.redis-headless.spatiumddi.svc.cluster.local:26379,redis-1.redis-headless.spatiumddi.svc.cluster.local:26379,redis-2.redis-headless.spatiumddi.svc.cluster.local:26379/0"
            - name: CELERY_BROKER_URL
              value: "sentinel://:$(REDIS_PASSWORD)@redis-sentinel:26379/1"
            - name: CELERY_RESULT_BACKEND
              value: "sentinel://:$(REDIS_PASSWORD)@redis-sentinel:26379/2"
          # Liveness — "process responds to HTTP". Deliberately shallow:
          # a transient Postgres blip should not trigger a pod restart.
          #
          # timeoutSeconds is EXPLICIT because the k8s default is 1s and the
          # api is a single-worker uvicorn: any synchronous work on the event
          # loop (bcrypt, an inline render, a slow estate query) pushes the
          # probe's p95 past 1s under load, and three straight tail probes had
          # the kubelet restarting a HEALTHY pod every few minutes — operators
          # saw it as recurring ~1 min windows of bare nginx 502s. Every other
          # workload in this chart already sets timeoutSeconds; the api was
          # the one omission.
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          # Readiness — "can actually serve traffic". /health/ready
          # checks DB + Redis connectivity, so an api pod that can't
          # reach its dependencies is taken out of the LB rotation
          # instead of returning 5xx to clients.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: spatiumddi
spec:
  selector:
    app: spatiumddi-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: spatiumddi
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
