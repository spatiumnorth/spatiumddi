# One-off Job: re-encrypt stored credentials for a new SECRET_KEY (#1222).
# NOT under k8s/base, so `kubectl apply -f k8s/base/` never runs it.
# Follow "Rotating SECRET_KEY" in k8s/README.md; in short:
#   1. scale api / worker / beat to 0
#   2. copy the current key into secret spatiumddi-old-secret-key
#   3. put a new key in spatiumddi-secrets
#   4. kubectl apply -f k8s/ops/rotate-secret-key-job.yaml, wait, read its log
#   5. only once the log ends with "Done.", delete this Job and
#      spatiumddi-old-secret-key (the only copy of the old key), scale back up
apiVersion: batch/v1
kind: Job
metadata:
  name: spatiumddi-rotate-secret-key
  namespace: spatiumddi
  labels:
    app.kubernetes.io/name: spatiumddi
    app.kubernetes.io/component: rotate-secret-key
spec:
  # A failure is reported, never retried blind: the log says what to fix,
  # and a re-run after fixing it is safe (values already moved are skipped).
  backoffLimit: 0
  template:
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Never
      containers:
        - name: rotate
          image: ghcr.io/spatiumnorth/spatiumddi-api:latest
          imagePullPolicy: Always
          command: ["python", "-m", "app.core.rotate_secret_key"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spatiumddi-secrets
                  key: postgres-password
            # The NEW key, from the secret the api reads.
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: spatiumddi-secrets
                  key: secret-key
            # The key being replaced. From a secret, never a literal, so it
            # stays out of the manifest and the process list.
            - name: OLD_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: spatiumddi-old-secret-key
                  key: secret-key
            - name: DATABASE_URL
              value: "postgresql+asyncpg://spatiumddi:$(POSTGRES_PASSWORD)@postgres-rw:5432/spatiumddi"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
