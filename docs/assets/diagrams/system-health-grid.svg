<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="220" viewBox="0 0 920 220"
     preserveAspectRatio="xMidYMid meet"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Platform Health strip</title>
  <desc>The Platform Health card on the dashboard, fed by /health/platform: five cells (API, PostgreSQL, Redis, Workers, Beat), each a status dot and a one-line detail.</desc>

  <rect x="0" y="0" width="920" height="220" fill="#f8fafc"/>
  <text x="40" y="42" font-size="18" font-weight="600" fill="#0f172a">Platform Health strip</text>

  <rect x="40" y="62" width="840" height="120" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="64" cy="87" r="4" fill="#22c55e"/>
  <text x="76" y="91" font-size="12" font-weight="600" fill="#0f172a" letter-spacing="1.2">PLATFORM HEALTH</text>
  <text x="238" y="91" font-size="11" fill="#64748b">all good</text>
  <path d="M 40 106 H 880" stroke="#e2e8f0" stroke-width="2" fill="none"/>
  <circle cx="62" cy="144" r="5" fill="#22c55e"/>
  <text x="76" y="141" font-size="13" font-weight="600" fill="#0f172a">API</text>
  <text x="76" y="159" font-size="11" fill="#64748b">responding</text>
  <path d="M 208 106 V 182" stroke="#e2e8f0" stroke-width="2" fill="none"/>
  <circle cx="230" cy="144" r="5" fill="#22c55e"/>
  <text x="244" y="141" font-size="13" font-weight="600" fill="#0f172a">PostgreSQL</text>
  <text x="244" y="159" font-size="11" fill="#64748b">SELECT 1 in 2 ms</text>
  <path d="M 376 106 V 182" stroke="#e2e8f0" stroke-width="2" fill="none"/>
  <circle cx="398" cy="144" r="5" fill="#22c55e"/>
  <text x="412" y="141" font-size="13" font-weight="600" fill="#0f172a">Redis</text>
  <text x="412" y="159" font-size="11" fill="#64748b">ping in 1 ms</text>
  <path d="M 544 106 V 182" stroke="#e2e8f0" stroke-width="2" fill="none"/>
  <circle cx="566" cy="144" r="5" fill="#22c55e"/>
  <text x="580" y="141" font-size="13" font-weight="600" fill="#0f172a">Workers</text>
  <text x="580" y="159" font-size="11" fill="#64748b">1 alive</text>
  <path d="M 712 106 V 182" stroke="#e2e8f0" stroke-width="2" fill="none"/>
  <circle cx="734" cy="144" r="5" fill="#22c55e"/>
  <text x="748" y="141" font-size="13" font-weight="600" fill="#0f172a">Beat</text>
  <text x="748" y="159" font-size="11" fill="#64748b">last tick 12s ago</text>
  <text x="880" y="206" text-anchor="end" font-size="11" fill="#64748b">dot: green ok · amber warn · red error</text>
</svg>
