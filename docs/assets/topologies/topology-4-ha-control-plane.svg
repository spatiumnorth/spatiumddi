<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="720" viewBox="0 0 920 720"
     preserveAspectRatio="xMidYMid meet"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="t4-host" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="t4-cp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="t4-store" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="t4-cache" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="t4-lb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <marker id="t4-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Not-supported banner -->
  <rect x="60" y="10" width="800" height="40" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="460" y="27" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Patroni is not supported in 1.0 (#1236)</text>
  <text x="460" y="43" text-anchor="middle" font-size="11" fill="#92400e">The Compose Patroni overlay does not work. Supported HA: CloudNativePG on Kubernetes, or the OS appliance (Topology 7).</text>

  <!-- Operators -->
  <rect x="354" y="80" width="212" height="42" rx="21" fill="#1e293b"/>
  <text x="460" y="106" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">operators / API consumers</text>

  <!-- LB -->
  <rect x="320" y="152" width="280" height="50" rx="8" fill="url(#t4-lb)"/>
  <text x="460" y="176" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">nginx / haproxy</text>
  <text x="460" y="192" text-anchor="middle" font-size="10" fill="#dbeafe">TLS termination · sticky LB for SSE</text>
  <line x1="460" y1="122" x2="460" y2="152" stroke="#475569" stroke-width="2"
        marker-end="url(#t4-arrow)"/>

  <!-- API hosts -->
  <g>
    <rect x="100" y="240" width="240" height="100" rx="10"
          fill="url(#t4-host)" stroke="#94a3b8" stroke-width="2"/>
    <text x="220" y="266" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">vm-api-01</text>
    <rect x="120" y="278" width="90" height="48" rx="6" fill="url(#t4-cp)"/>
    <text x="165" y="308" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">api · frontend</text>
    <rect x="220" y="278" width="100" height="48" rx="6" fill="url(#t4-cp)"/>
    <text x="270" y="308" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">worker</text>
  </g>
  <g>
    <rect x="580" y="240" width="240" height="100" rx="10"
          fill="url(#t4-host)" stroke="#94a3b8" stroke-width="2"/>
    <text x="700" y="266" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">vm-api-02</text>
    <rect x="600" y="278" width="90" height="48" rx="6" fill="url(#t4-cp)"/>
    <text x="645" y="308" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">api · frontend</text>
    <rect x="700" y="278" width="100" height="48" rx="6" fill="url(#t4-cp)"/>
    <text x="750" y="308" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">worker</text>
  </g>

  <!-- Beat singleton -->
  <rect x="354" y="260" width="212" height="60" rx="8" fill="url(#t4-cp)"/>
  <text x="460" y="286" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">vm-beat (single)</text>
  <text x="460" y="306" text-anchor="middle" font-size="10" fill="#ddd6fe">celery beat — not horizontally scalable</text>

  <line x1="340" y1="202" x2="220" y2="240" stroke="#475569" stroke-width="2"
        marker-end="url(#t4-arrow)"/>
  <line x1="580" y1="202" x2="700" y2="240" stroke="#475569" stroke-width="2"
        marker-end="url(#t4-arrow)"/>

  <!-- Redis Sentinel cluster -->
  <g>
    <rect x="60" y="380" width="800" height="100" rx="12"
          fill="url(#t4-host)" stroke="#94a3b8" stroke-width="2"/>
    <text x="80" y="406" font-size="13" font-weight="600" fill="#0f172a">Redis Sentinel — 3 nodes</text>
    <rect x="180" y="418" width="180" height="48" rx="6" fill="url(#t4-cache)"/>
    <text x="270" y="440" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">vm-redis-01</text>
    <text x="270" y="456" text-anchor="middle" font-size="10" fill="#cffafe">master + sentinel</text>
    <rect x="370" y="418" width="180" height="48" rx="6" fill="url(#t4-cache)"/>
    <text x="460" y="440" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">vm-redis-02</text>
    <text x="460" y="456" text-anchor="middle" font-size="10" fill="#cffafe">replica + sentinel</text>
    <rect x="560" y="418" width="180" height="48" rx="6" fill="url(#t4-cache)"/>
    <text x="650" y="440" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">vm-redis-03</text>
    <text x="650" y="456" text-anchor="middle" font-size="10" fill="#cffafe">replica + sentinel</text>
  </g>

  <!-- Patroni cluster -->
  <g>
    <rect x="60" y="510" width="800" height="160" rx="12"
          fill="url(#t4-host)" stroke="#94a3b8" stroke-width="2"/>
    <text x="80" y="536" font-size="13" font-weight="600" fill="#0f172a">PostgreSQL HA design — Patroni, 3 nodes (CloudNativePG is the supported path)</text>

    <rect x="180" y="548" width="180" height="56" rx="6" fill="url(#t4-store)"/>
    <text x="270" y="570" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">vm-pg-01</text>
    <text x="270" y="588" text-anchor="middle" font-size="10" fill="#bbf7d0">primary + etcd</text>

    <rect x="370" y="548" width="180" height="56" rx="6" fill="url(#t4-store)"/>
    <text x="460" y="570" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">vm-pg-02</text>
    <text x="460" y="588" text-anchor="middle" font-size="10" fill="#bbf7d0">replica + etcd</text>

    <rect x="560" y="548" width="180" height="56" rx="6" fill="url(#t4-store)"/>
    <text x="650" y="570" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">vm-pg-03</text>
    <text x="650" y="588" text-anchor="middle" font-size="10" fill="#bbf7d0">replica + etcd</text>

    <text x="460" y="628" text-anchor="middle" font-size="11" fill="#475569">
      HAProxy in front: read/write on :5000  ·  read-only on :5001
    </text>
    <text x="460" y="646" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">
      a restore writes through :5000 (the primary)
    </text>
  </g>
</svg>
