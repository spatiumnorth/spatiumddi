{{- /* Issue #183 Phase 2 — Kea DHCP agent.
       DaemonSet so Kea binds the host network namespace via
       ``hostNetwork: true`` + ``CAP_NET_BIND_SERVICE`` for udp/67.
       Same shape as today's docker-compose ``network_mode: host``
       entry. Single node on the appliance, so DaemonSet
       degenerates to one pod.

       Phase 10 wave 2 — ``.enabled`` is release-ownership scope
       (bootstrap=false, appliance=true), NOT role-scope. The
       supervisor's spatiumddi-appliance HelmChart sets
       ``dhcpKea.enabled=true``; the bootstrap release sets it
       false. Pod scheduling is gated by the
       ``spatium.io/role-dhcp=true`` node label — pod sits in
       Pending until the supervisor labels the node. */}}
{{- if .Values.dhcpKea.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dhcp-kea
  labels:
    {{- include "spatiumddi-appliance.labels" . | nindent 4 }}
    app.kubernetes.io/component: dhcp-kea
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dhcp-kea
  template:
    metadata:
      labels:
        {{- include "spatiumddi-appliance.podLabels" . | nindent 8 }}
        app.kubernetes.io/name: dhcp-kea
        app.kubernetes.io/component: dhcp-kea
    spec:
      {{- with .Values.dhcpKea.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with (include "spatiumddi-appliance.seccompProfileType" $) }}
      securityContext:
        seccompProfile:
          type: {{ . }}
      {{- end }}
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector | nindent 8 }}
        # Phase 10 (#183) — per-role scheduling label. The supervisor
        # labels the node with ``spatium.io/role-dhcp=true`` when DHCP
        # is in the desired role set, and clears the label on
        # role removal — pod sits Pending until then.
        spatium.io/role-dhcp: "true"
      # ``hostNetwork: true`` lets Kea see DHCP-discover broadcasts on
      # the host NIC. Required: relayed deployments would use a
      # different mode (Phase 5).
      hostNetwork: true
      # ``dnsPolicy: ClusterFirstWithHostNet`` so the pod can still
      # resolve in-cluster service names even though it lives in the
      # host net namespace.
      dnsPolicy: ClusterFirstWithHostNet
      # #296 Phase A2 — longer than DNS because the DHCP exchange is
      # a 4-message DORA round-trip; a client mid-handshake when SIGTERM
      # lands needs time to either complete or back off cleanly. The
      # rolling upgrade orchestrator's per-node drain budgets ≥60 s
      # per Kea pod.
      terminationGracePeriodSeconds: 60
      containers:
        - name: dhcp-kea
          image: {{ include "spatiumddi-appliance.imageRef" (dict "global" .Values.global "repository" .Values.dhcpKea.image.repository) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          # A CPU request is what keeps Kea serving when the control plane
          # is busy: without one the pod is BestEffort, i.e. the LOWEST CFS
          # weight on the node (cpu.weight 1 against the api's 4), and on a
          # 3-vCPU appliance the api's lease-event work starves Kea's single
          # thread until its socket queue overflows — the sizing campaign
          # measured 37 % of DISCOVERs answered at 5632 MiB / 3 vCPU with the
          # DHCP server at 7.5 % CPU. Requests only (a CPU limit would
          # throttle the very burst we need served); see values.yaml.
          {{- with .Values.dhcpKea.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # NET_BIND_SERVICE — bind udp/67 (privileged port). NET_RAW
          # is needed by Kea's raw-socket DHCPDISCOVER read path when
          # not behind a relay agent.
          securityContext:
            capabilities:
              add:
                - NET_BIND_SERVICE
                - NET_RAW
          env:
            # Kea entrypoint env contract (agent/dhcp/images/kea/
            # entrypoint.sh): SPATIUM_API_URL + SPATIUM_AGENT_KEY +
            # AGENT_GROUP.
            # #292 / #409 — in-cluster API Service over HTTP by default;
            # prefer the supervisor-supplied external controlPlaneUrl when
            # set (Application appliance with its own k3s — no in-cluster
            # control Service), verified against the supervisor's pinned
            # certificate (#1281). See dns-bind9.yaml for the full rationale.
            - name: SPATIUM_API_URL
              value: {{ .Values.dhcpKea.controlPlaneUrl | default .Values.dhcpKea.inClusterApiUrl | default (printf "http://spatium-control-spatiumddi-api.%s.svc:8000" .Release.Namespace) | quote }}
            {{- if .Values.dhcpKea.controlPlaneUrl }}
            {{- include "spatiumddi-appliance.cpPin.env" . | nindent 12 }}
            {{- end }}
            - name: SPATIUM_AGENT_KEY
              value: {{ .Values.dhcpKea.agentKey | quote }}
            - name: AGENT_GROUP
              value: {{ .Values.dhcpKea.serverGroupName | quote }}
            {{- with .Values.global.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # (Historical note: an earlier plan routed liveness through
          # ``kea-ctrl-agent``'s status-get. That daemon was never used by
          # SpatiumDDI and was removed in #637 — the agent speaks to Kea over
          # its unix control socket. The real gate is the two-condition
          # readiness probe below.)
          #
          # #296 Phase A2 — readiness gates the per-node Phase 8 rolling
          # upgrade's uncordon step. A kubernetes-Ready node briefly
          # served no DHCP while the new pod pulled its image + warmed
          # its config-bundle cache from the control plane; this gate
          # blocks until BOTH conditions hold:
          #   1. ``.ready`` marker exists — set by the agent's sync loop
          #      after the first successful ConfigBundle fetch + persist
          #      + Kea reload. Persists across container restarts on the
          #      hostPath volume (#292), so a warm-restart pod is Ready
          #      immediately. A failed apply does NOT stamp it.
          #   2. UDP/67 (hex :0043) is bound in /proc/net/udp — confirms
          #      kea-dhcp4 is up + listening. ``ss`` isn't in the kea
          #      image so we read /proc/net/udp directly; same approach
          #      the pre-A2 probe used.
          # Probe cadence matches DNS — 5s initial / 10s period / 3
          # failures / 3s timeout — for consistency across the three
          # DaemonSets; the pre-A2 10s/30s was too slow for the
          # orchestrator's per-node uncordon gate.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "test -f /var/lib/spatium-dhcp-agent/.ready && grep -q ':0043 ' /proc/net/udp"
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          volumeMounts:
            # #292 — persistent agent config-bundle cache (#5): on a pod
            # restart during a control-plane outage this is the only thing
            # that lets Kea keep serving leases from last-known-good
            # config. Was never mounted before (ephemeral container layer).
            - name: agent-state
              mountPath: /var/lib/spatium-dhcp-agent
            - name: leases
              mountPath: /var/lib/kea
            {{- if .Values.dhcpKea.controlPlaneUrl }}
            {{- include "spatiumddi-appliance.cpPin.mount" . | nindent 12 }}
            {{- end }}
      # #292 — per-node hostPath (not shared PVC, not emptyDir). The
      # shared local-path PVC pinned its PV to one node → other DaemonSet
      # pods Pending; emptyDir would drop leases + the #5 cache on
      # restart. hostPath keeps each node's leases + cache durable on the
      # persistent /var partition. See dns-bind9.yaml for the full note.
      volumes:
        {{- if .Values.dhcpKea.controlPlaneUrl }}
        {{- include "spatiumddi-appliance.cpPin.volume" . | nindent 8 }}
        {{- end }}
        - name: agent-state
          hostPath:
            path: /var/lib/spatiumddi/agents/dhcp-kea/state
            type: DirectoryOrCreate
        - name: leases
          hostPath:
            path: /var/lib/spatiumddi/agents/dhcp-kea/leases
            type: DirectoryOrCreate
{{- if .Values.dhcpKea.relayVIP }}
---
# #272 Phase 5 — DHCP relay-VIP. An ADDITIONAL LoadBalancer Service so a
# DHCP relay's ``forward-to`` target is a stable floating IP that
# outlives any single Kea node. Kea still runs hostNetwork:67 (the
# DaemonSet above) for direct-attached VLAN broadcast reach — this VIP
# only fronts the relay→server unicast forward, NOT client-facing :67.
apiVersion: v1
kind: Service
metadata:
  name: dhcp-kea-relay
  labels:
    {{- include "spatiumddi-appliance.labels" . | nindent 4 }}
    app.kubernetes.io/component: dhcp-kea
  annotations:
    # Prefer a dedicated DHCP relay pool; fall back to the shared
    # control-plane pool (dns.vipPool) so a single-pool install still
    # works without setting both. Decouples DHCP VIP config from DNS.
    metallb.universe.tf/address-pool: {{ .Values.dhcpKea.relayVIPPool | default .Values.dns.vipPool | quote }}
    metallb.universe.tf/loadBalancerIPs: {{ .Values.dhcpKea.relayVIP | quote }}
spec:
  type: LoadBalancer
  # #1550 — see dns-bind9.yaml: a MetalLB VIP needs no NodePorts.
  allocateLoadBalancerNodePorts: false
  selector:
    app.kubernetes.io/name: dhcp-kea
  ports:
    - name: dhcp-server
      port: 67
      targetPort: 67
      protocol: UDP
{{- end }}
{{- end }}
