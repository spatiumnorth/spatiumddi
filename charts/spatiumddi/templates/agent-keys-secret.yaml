{{/*
#4648 — agent PSKs (DNS_AGENT_KEY / DHCP_AGENT_KEY on the api + worker) no
longer depend on dnsAgents.enabled / dhcpAgents.enabled: an appliance agent
node joined to this control plane needs them even with no in-cluster agents.

1. agentKey.existingSecret            -> operator owns the Secret (nothing here)
2. agentKey.value                     -> <fullname>-{dns,dhcp}-agent-key, below
3. neither                            -> chart-generated <fullname>-agent-keys,
   minted once and preserved across upgrades via `lookup` AND across
   uninstall / reinstall via `helm.sh/resource-policy: keep` (same pair as
   secret.yaml; see its header). A render that cannot see the cluster
   (helm template, Argo CD / Flux diff) generates nothing, because a fresh
   random key per sync would strand every registered agent; pin the keys
   with agentKey.existingSecret / value there.
*/}}
{{- if and (not .Values.dnsAgents.agentKey.existingSecret) .Values.dnsAgents.agentKey.value }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "spatiumddi.dnsAgentKeySecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spatiumddi.componentLabels" (merge (dict "component" "dns-agent") .) | nindent 4 }}
type: Opaque
stringData:
  DNS_AGENT_KEY: {{ .Values.dnsAgents.agentKey.value | quote }}
---
{{- end }}
{{- if and (not .Values.dhcpAgents.agentKey.existingSecret) .Values.dhcpAgents.agentKey.value }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "spatiumddi.dhcpAgentKeySecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spatiumddi.componentLabels" (merge (dict "component" "dhcp-agent") .) | nindent 4 }}
type: Opaque
stringData:
  SPATIUM_AGENT_KEY: {{ .Values.dhcpAgents.agentKey.value | quote }}
---
{{- end }}
{{- $name := printf "%s-agent-keys" (include "spatiumddi.fullname" .) -}}
{{- $needDns := eq (include "spatiumddi.dnsAgentKeySecret" .) $name -}}
{{- $needDhcp := eq (include "spatiumddi.dhcpAgentKeySecret" .) $name -}}
{{- if or $needDns $needDhcp }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $prevDns := "" -}}
{{- $prevDhcp := "" -}}
{{- if $existing -}}
{{- $prevDns = index $existing.data "DNS_AGENT_KEY" | default "" | b64dec -}}
{{- $prevDhcp = index $existing.data "SPATIUM_AGENT_KEY" | default "" | b64dec -}}
{{- end -}}
{{- /* #4648 — the namespace's `default` ServiceAccount does not exist yet on
       a first install with --create-namespace (the controller adds it after),
       so that probe alone read a real install as "no cluster" and generated
       nothing. A LIST of ConfigMaps in the release namespace answers with a
       List object from any reachable cluster, even for a namespace not created
       yet, and is empty only on a render with no cluster (helm template, a
       GitOps diff). Listing ConfigMaps in its own namespace is a right every
       installer of this chart already has, so it never fails the render the
       way a cluster-scoped lookup can for a namespace-scoped user. */ -}}
{{- $clusterVisible := or $existing (lookup "v1" "ServiceAccount" .Release.Namespace "default") (lookup "v1" "ConfigMap" .Release.Namespace "") -}}
{{- $dnsKey := $prevDns -}}
{{- $dhcpKey := $prevDhcp -}}
{{- if and (not $dnsKey) $clusterVisible -}}{{- $dnsKey = randAlphaNum 48 -}}{{- end -}}
{{- if and (not $dhcpKey) $clusterVisible -}}{{- $dhcpKey = randAlphaNum 48 -}}{{- end -}}
{{- if or $dnsKey $dhcpKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spatiumddi.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  {{- if $dnsKey }}
  DNS_AGENT_KEY: {{ $dnsKey | quote }}
  {{- end }}
  {{- if $dhcpKey }}
  SPATIUM_AGENT_KEY: {{ $dhcpKey | quote }}
  {{- end }}
{{- end }}
{{- end }}
