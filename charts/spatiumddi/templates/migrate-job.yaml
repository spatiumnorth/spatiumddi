{{- if .Values.migrate.enabled }}
# Regular Job (no helm.sh/hook). The previous pre-install-hook design
# raced the bundled postgresql subchart: hooks run before any subchart
# resource is applied, so the migrate pod failed CreateContainerConfigError
# trying to mount the not-yet-created <release>-postgresql Secret. The
# install would then time out waiting for a hook that could never start.
#
# As a regular Job we land in normal apply order alongside the subchart;
# the wait-for-postgres init container blocks until Postgres is accepting
# connections, then alembic upgrade runs to head. api / worker / beat
# carry a matching wait-for-migrate init container so their pods don't
# come up before the schema lands.
#
# Job specs are immutable for fields like ``template`` after first
# create. We sidestep that on ``helm upgrade`` by suffixing the name
# with .Release.Revision so each install/upgrade creates a fresh Job.
# Old Jobs (and their pods, with TTL) are garbage-collected by
# ``ttlSecondsAfterFinished`` below — operators don't have to clean up
# revisions manually.
{{- /* #2114: ``helm template`` (Argo CD, and any tool that renders the chart
       rather than installing it) always sees .Release.Revision = 1, so the
       name never changes and the first image bump hits "field is
       immutable". ``migrate.annotations`` lets those deployments make the
       Job a sync hook that is deleted and recreated on every sync. A template
       comment, not a YAML one, so the default render stays byte-identical. */}}
apiVersion: batch/v1
kind: Job
metadata:
{{- /* #3862: ``migrate.nameByContent`` (the OLM Operator sets it) names the Job
       after a hash of what renders it instead of the Helm revision, and keeps
       the finished Job instead of expiring it. helm-operator dry-runs an
       upgrade on every reconcile and upgrades whenever that manifest differs
       from the deployed one; a revision in the name always differs, so it
       would upgrade forever, deleting the running migrate Job each time, and
       a TTL-expired Job would be recreated and re-run. Same inputs, same
       name: no diff. Any change to them is a new Job, so the pod template is
       never patched in place (Job templates are immutable). */}}
{{- $byContent := eq (toString .Values.migrate.nameByContent) "true" }}
{{- if $byContent }}
  name: {{ include "spatiumddi.fullname" . }}-migrate-{{ toJson (list .Values .Chart.Version .Chart.AppVersion .Capabilities.KubeVersion.Version .Release.Name .Release.Namespace) | sha256sum | trunc 10 }}
{{- else }}
  name: {{ include "spatiumddi.fullname" . }}-migrate-r{{ .Release.Revision }}
{{- end }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spatiumddi.componentLabels" (merge (dict "component" "migrate") .) | nindent 4 }}
  {{- with .Values.migrate.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  {{- if not $byContent }}
  ttlSecondsAfterFinished: {{ .Values.migrate.ttlSecondsAfterFinished | default 600 }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "spatiumddi.componentSelectorLabels" (merge (dict "component" "migrate") .) | nindent 8 }}
    spec:
      {{- with (include "spatiumddi.priorityClassName" (dict "component" .Values.migrate.priorityClassName "fallback" (.Values.global).priorityClassName)) }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with (include "spatiumddi.seccompProfileType" $) }}
      securityContext:
        seccompProfile:
          type: {{ . }}
      {{- end }}
      restartPolicy: OnFailure
      {{- /* #3207 — place the Job where the api runs unless told otherwise;
             null follows the api, {} / [] opt out of it. Following the api
             takes only its NODE affinity: ``api.affinity``'s podAffinity /
             podAntiAffinity describe the api pods' relation to each other
             (a hard anti-affinity naming the api's labels is the usual
             one), and copied onto the Job they would keep it off every node
             running an api pod, which under hard anti-affinity is every
             eligible node, while those api pods wait in wait-for-migrate
             for it. */}}
      {{- $nodeSel := ternary .Values.api.nodeSelector .Values.migrate.nodeSelector (kindIs "invalid" .Values.migrate.nodeSelector) }}
      {{- $tols := ternary .Values.api.tolerations .Values.migrate.tolerations (kindIs "invalid" .Values.migrate.tolerations) }}
      {{- $aff := ternary (pick (.Values.api.affinity | default dict) "nodeAffinity") .Values.migrate.affinity (kindIs "invalid" .Values.migrate.affinity) }}
      {{- with (include "spatiumddi.controlPlaneNodeSelector" (merge (dict "componentNodeSelector" $nodeSel) .) | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with $tols }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $aff }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "spatiumddi.waitForPostgresInit" . | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "spatiumddi.image" (merge (dict "imageName" "spatiumddi-api") .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          env:
            {{- include "spatiumddi.commonEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
{{- end }}
