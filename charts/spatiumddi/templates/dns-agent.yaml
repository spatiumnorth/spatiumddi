{{- if .Values.dnsAgents.enabled }}
{{- $root := . -}}
{{- $tag := .Values.dnsAgents.image.tag | default .Chart.AppVersion -}}
{{- $secretName := .Values.dnsAgents.agentKey.existingSecret | default (printf "%s-dns-agent-key" (include "spatiumddi.fullname" .)) -}}
{{- if and (not .Values.dnsAgents.agentKey.existingSecret) .Values.dnsAgents.agentKey.value }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spatiumddi.componentLabels" (merge (dict "component" "dns-agent") .) | nindent 4 }}
type: Opaque
stringData:
  DNS_AGENT_KEY: {{ .Values.dnsAgents.agentKey.value | quote }}
---
{{- end }}
{{- range $server := .Values.dnsAgents.servers }}
{{- $flavor := $server.flavor | default "bind9" -}}
{{- /* #1553 — refuse encrypted-transport ports the flavor cannot serve,
       instead of rendering a Service port that forwards to nothing.
       DoQ is Technitium-only (BIND9 and PowerDNS have no QUIC listener,
       and the API refuses doq_enabled on a group with a non-Technitium
       member). PowerDNS serves DoT/DoH only behind a dnsdist front,
       which has no Kubernetes deployment yet — its ports would be
       declared on the pod and both Services and answer nothing. */ -}}
{{- if and $server.doqPort (ne $flavor "technitium") }}
{{- fail (printf "dnsAgents server %q: doqPort is only supported with flavor: technitium (got flavor: %s) — remove doqPort or change the flavor" $server.name $flavor) }}
{{- end }}
{{- if and (eq $flavor "powerdns") (or $server.dotPort $server.dohPort) }}
{{- fail (printf "dnsAgents server %q: dotPort/dohPort are not supported with flavor: powerdns — PowerDNS needs a dnsdist front for DoT/DoH, which has no Kubernetes deployment yet; remove dotPort/dohPort" $server.name) }}
{{- end }}
{{- $instance := printf "dns-%s-%s" $flavor $server.name -}}
{{- /* Per-flavor image lookup (issue #127). dnsAgents.flavors.<flavor>
       optionally overrides repository + tag; missing keys (or the default
       bind9 case) fall back to the top-level dnsAgents.image. Same
       Chart.AppVersion fallback applies to either source. */ -}}
{{- $flavorImg := dict -}}
{{- if $root.Values.dnsAgents.flavors -}}
  {{- $flavorImg = (get $root.Values.dnsAgents.flavors $flavor) | default (dict) -}}
{{- end -}}
{{- $repo := $flavorImg.repository | default $root.Values.dnsAgents.image.repository -}}
{{- $imgTag := $flavorImg.tag | default $tag -}}
{{- /* Volume mount path for the driver's zone-state volume. BIND9 caches
       zone files under /var/cache/bind; PowerDNS LMDB lives at
       /var/lib/powerdns; Technitium's own config + zone store lives at
       /etc/dns (its query/error log dir, /var/log/technitium, is NOT
       persisted here — it's daemon-internal logging, not zone state, and
       lives fine on the pod's ephemeral writable layer). The volume claim
       itself ("dns-state") is the same; only the mount path changes. */ -}}
{{- $dnsStatePath := "/var/cache/bind" -}}
{{- if eq $flavor "powerdns" -}}
  {{- $dnsStatePath = "/var/lib/powerdns" -}}
{{- else if eq $flavor "technitium" -}}
  {{- $dnsStatePath = "/etc/dns" -}}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $instance }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "spatiumddi.componentLabels" (merge (dict "component" "dns-agent") $root) | nindent 4 }}
    app.kubernetes.io/instance-name: {{ $server.name | quote }}
    spatiumddi.org/dns-flavor: {{ $flavor }}
    spatiumddi.org/dns-role: {{ $server.role | default "primary" }}
spec:
  serviceName: {{ $instance }}-headless
  replicas: 1
  selector:
    matchLabels:
      {{- include "spatiumddi.componentSelectorLabels" (merge (dict "component" "dns-agent") $root) | nindent 6 }}
      app.kubernetes.io/instance-name: {{ $server.name | quote }}
  template:
    metadata:
      labels:
        {{- include "spatiumddi.componentSelectorLabels" (merge (dict "component" "dns-agent") $root) | nindent 8 }}
        app.kubernetes.io/instance-name: {{ $server.name | quote }}
        spatiumddi.org/dns-flavor: {{ $flavor }}
    spec:
      {{- with (include "spatiumddi.priorityClassName" (dict "component" $root.Values.dnsAgents.priorityClassName "fallback" ($root.Values.global).servicePriorityClassName)) }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with (include "spatiumddi.seccompProfileType" $) }}
      securityContext:
        seccompProfile:
          type: {{ . }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: {{ include "spatiumddi.name" $root }}
                    app.kubernetes.io/component: dns-agent
                topologyKey: kubernetes.io/hostname
      {{- with $root.Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dns
          image: "{{ $repo }}:{{ $imgTag }}"
          imagePullPolicy: {{ $root.Values.dnsAgents.image.pullPolicy }}
          env:
            - name: CONTROL_PLANE_URL
              # Trailing dot on the Service name: the pod inherits the node's
              # DHCP search domains, and under ndots:5 a NODATA-answering
              # inherited zone aborts the resolver's search walk before the
              # bare name is ever tried (#777). Absolute skips the list.
              value: "http://{{ include "spatiumddi.fullname" $root }}-api.{{ $root.Release.Namespace }}.svc.cluster.local.:{{ $root.Values.api.service.port }}"
            - name: SERVER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AGENT_GROUP
              value: {{ $server.group | default "default" | quote }}
            - name: AGENT_ROLES
              value: {{ $server.role | default "authoritative" | quote }}
            - name: DNS_AGENT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: DNS_AGENT_KEY
          ports:
            - { name: dns-udp, containerPort: 53, protocol: UDP }
            - { name: dns-tcp, containerPort: 53, protocol: TCP }
            {{- /* #50 / #799 — encrypted transports. Listener ports are
                   configured in the DB (DNS -> group -> options); these
                   declarations only make them routable + visible. Set per
                   server to match.

                   doqPort is UDP and applies to flavor: technitium only —
                   BIND has no QUIC transport and the API refuses
                   doq_enabled on any group with a non-Technitium member.
                   It may carry the SAME number as dotPort: 853 is the RFC
                   default for both DoT (TCP) and DoQ (UDP), and Kubernetes
                   allows the repeat because the port NAMES differ. */}}
            {{- with $server.dotPort }}
            - { name: dns-dot, containerPort: {{ . }}, protocol: TCP }
            {{- end }}
            {{- with $server.dohPort }}
            - { name: dns-doh, containerPort: {{ . }}, protocol: TCP }
            {{- end }}
            {{- with $server.doqPort }}
            - { name: dns-doq, containerPort: {{ . }}, protocol: UDP }
            {{- end }}
          readinessProbe:
            tcpSocket: { port: 53 }
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- /* #1056 — the agent now WAITS for its first bundle instead of
                 exiting 2 one second after "startup deferred". A readiness
                 probe never restarts a pod, so without a liveness probe a
                 server whose bundle never arrives (wrong group, revoked key,
                 a control plane that heartbeats but renders nothing) would
                 sit NotReady for ever. Same shape as the appliance chart's
                 dns-bind9 / dns-powerdns / dns-technitium: 30 s initial
                 delay covers a slow first bundle, 3 × 30 s to a restart
                 with the reason in the agent's log. */}}
          livenessProbe:
            tcpSocket: { port: 53 }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml ($server.resources | default (dict "requests" (dict "cpu" "100m" "memory" "128Mi") "limits" (dict "cpu" "500m" "memory" "512Mi"))) | nindent 12 }}
          volumeMounts:
            - { name: agent-state, mountPath: /var/lib/spatium-dns-agent }
            - { name: dns-state,   mountPath: {{ $dnsStatePath | quote }} }
  volumeClaimTemplates:
    - metadata: { name: agent-state }
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ (get ($server.storage | default dict) "agentState") | default "1Gi" }}
    - metadata: { name: dns-state }
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ (get ($server.storage | default dict) "dnsState") | default "2Gi" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $instance }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "spatiumddi.componentLabels" (merge (dict "component" "dns-agent") $root) | nindent 4 }}
    app.kubernetes.io/instance-name: {{ $server.name | quote }}
spec:
  type: {{ (get ($server.service | default dict) "type") | default "LoadBalancer" }}
  selector:
    {{- include "spatiumddi.componentSelectorLabels" (merge (dict "component" "dns-agent") $root) | nindent 4 }}
    app.kubernetes.io/instance-name: {{ $server.name | quote }}
  ports:
    - { name: dns-udp, port: 53, targetPort: 53, protocol: UDP }
    - { name: dns-tcp, port: 53, targetPort: 53, protocol: TCP }
    {{- with $server.dotPort }}
    - { name: dns-dot, port: {{ . }}, targetPort: {{ . }}, protocol: TCP }
    {{- end }}
    {{- with $server.dohPort }}
    - { name: dns-doh, port: {{ . }}, targetPort: {{ . }}, protocol: TCP }
    {{- end }}
    {{- with $server.doqPort }}
    - { name: dns-doq, port: {{ . }}, targetPort: {{ . }}, protocol: UDP }
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $instance }}-headless
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "spatiumddi.componentLabels" (merge (dict "component" "dns-agent") $root) | nindent 4 }}
    app.kubernetes.io/instance-name: {{ $server.name | quote }}
spec:
  clusterIP: None
  selector:
    {{- include "spatiumddi.componentSelectorLabels" (merge (dict "component" "dns-agent") $root) | nindent 4 }}
    app.kubernetes.io/instance-name: {{ $server.name | quote }}
  ports:
    - { name: dns-udp, port: 53, protocol: UDP }
    - { name: dns-tcp, port: 53, protocol: TCP }
    {{- with $server.dotPort }}
    - { name: dns-dot, port: {{ . }}, protocol: TCP }
    {{- end }}
    {{- with $server.dohPort }}
    - { name: dns-doh, port: {{ . }}, protocol: TCP }
    {{- end }}
    {{- with $server.doqPort }}
    - { name: dns-doq, port: {{ . }}, protocol: UDP }
    {{- end }}
---
{{- end }}
{{- end }}
