{{- if and .Values.redis.enabled (eq (.Values.redis.kind | default "standalone") "sentinel") }}
{{- $cmp := "redis" -}}
{{- $fullname := include "spatiumddi.fullname" . -}}
{{- $sts := printf "%s-redis" $fullname -}}
{{- $headless := printf "%s-redis-headless" $fullname -}}
{{- $replicas := int .Values.redis.sentinel.replicas -}}
{{- $quorum := add (div $replicas 2) 1 -}}
{{- $master := .Values.redis.sentinel.masterName -}}
{{- $authEnabled := .Values.redis.auth.enabled -}}
# ─────────────────────────────────────────────────────────────────────────────
# Redis HA via Sentinel (#272 Phase 3).
#
# A StatefulSet of N pods, each running a redis-server + a
# redis-sentinel sidecar. The sentinels monitor the master + fail
# over automatically — after a failover the master moves to whichever
# replica wins the election, and clients (api / worker / beat) find it
# by querying the sentinels through the ``sentinel://`` URL in
# spatiumddi.commonEnv (no static master Service needed).
#
# Each pod's role is decided by its init container at every start
# (files/redis-sentinel-render-config.sh): it asks the running sentinels
# which pod is the master and follows it, or starts as master itself
# when they name it. Only when no sentinel answers (the whole set
# starting cold) does pod-0 start as master and pods 1..N-1 as its
# replicas. A fixed pod-0-is-master rule on every start turned a
# re-created master pod into a replica of its own replica (#1442).
#
# Config is rendered by the init container from a ConfigMap template +
# the password env (so the secret never lands in the ConfigMap).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-redis-sentinel-tmpl
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spatiumddi.componentLabels" (merge (dict "component" $cmp) .) | nindent 4 }}
data:
  # ``__PASSWORD__`` is substituted by the init container from the
  # REDIS_PASSWORD env (sourced from the chart secret). On no-auth
  # installs the password lines are dropped entirely.
  {{/*
    #590 — a hard power loss tears the AOF mid-write, and redis ships
    ``aof-load-corrupt-tail-max-size 0`` (refuse to start on ANY corrupt
    tail). A replica killed mid-write then crashloops forever on "Bad file
    format reading the append only file" — observed bricking a 3-node
    appliance over 158 bytes of torn cache. Redis is the cache + Celery
    broker here and Postgres is the store of record, so discarding a torn
    tail always beats never booting again.

    This is NOT covered by ``aof-load-truncated`` (default yes): that one
    handles a tail that simply ENDS mid-record. A power cut usually leaves
    a tail that is present but ZERO-FILLED (ext4 records the new file size
    before the data lands), which reads as corrupt, not short. See
    values.yaml for the full distinction.
  */}}
  redis.conf.tmpl: |
    maxmemory {{ .Values.redis.maxmemory }}
    maxmemory-policy allkeys-lru
    appendonly yes
    # Discard, don't die on, a power-cut-torn AOF tail (#590). Plain byte
    # count — redis rejects a "16mb"-style suffix on this directive.
    aof-load-corrupt-tail-max-size {{ int .Values.redis.aofLoadCorruptTailMaxBytes }}
    # #590 — announce this replica by its STABLE StatefulSet FQDN, not the
    # ephemeral pod IP. Without this the master's INFO reports each replica by
    # the IP it connected from, so a rescheduled pod is recorded as a brand-new
    # replica while the old IP lingers. Substituted by the init container.
    replica-announce-ip __POD_FQDN__
    replica-announce-port 6379
    {{- if $authEnabled }}
    requirepass __PASSWORD__
    masterauth __PASSWORD__
    {{- end }}
  # #1442 — how many pods render-config asks for the current master. Here
  # rather than in the pod's env so a promote that grows the set re-renders
  # it without rolling the pods already running (like the quorum below).
  replicas: {{ $replicas | quote }}
  sentinel.conf.tmpl: |
    sentinel resolve-hostnames yes
    sentinel announce-hostnames yes
    # #590 — the two directives above only control how Sentinel RENDERS an
    # address it already holds as a hostname; they do not decide what each
    # Sentinel announces about ITSELF. Unset, a Sentinel announces its pod IP.
    #
    # A pod that is rescheduled (node loss, drain, upgrade) comes back with a
    # new IP and a new runid, so its hello no longer matches the stored entry
    # and the peers add a SECOND one. The old entry never goes away: Sentinel
    # never forgets a Sentinel it has seen — removal requires SENTINEL RESET.
    #
    # That matters because Sentinel authorizes a failover only with a majority
    # of ALL KNOWN Sentinels (redis: ``voters = known + 1``; CKQUORUM needs
    # ``usable >= voters/2 + 1``). Dead ghosts stay in the denominator and
    # never vote, so with 3 live pods:
    #
    #     ghosts=1 → known 4 → need 3 → 3 usable → ok (at the edge)
    #     ghosts=2 → known 5 → need 3 → 3 usable → ok
    #     ghosts=3 → known 6 → need 4 → 3 usable → FAILOVER IMPOSSIBLE
    #
    # i.e. the THIRD node loss permanently strands the master, the api/worker
    # ``sentinel://`` URL never resolves one again, and the appliance API is
    # down for good. Observed live: one hard power-off of a single node left
    # exactly one s_down ghost at the dead pod's old IP.
    #
    # Announcing the stable FQDN makes a returning pod's hello match the stored
    # address, so peers replace the entry in place instead of accumulating one.
    sentinel announce-ip __POD_FQDN__
    sentinel announce-port 26379
    # __MASTER_HOST__ is the master render-config learned from the running
    # sentinels (pod-0 on a cold start of the whole set), #1442.
    sentinel monitor {{ $master }} __MASTER_HOST__ 6379 {{ $quorum }}
    sentinel down-after-milliseconds {{ $master }} {{ .Values.redis.sentinel.downAfterMs }}
    sentinel failover-timeout {{ $master }} {{ .Values.redis.sentinel.failoverTimeoutMs }}
    sentinel parallel-syncs {{ $master }} 1
    {{- if $authEnabled }}
    sentinel auth-pass {{ $master }} __PASSWORD__
    {{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $sts }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spatiumddi.componentLabels" (merge (dict "component" $cmp) .) | nindent 4 }}
spec:
  serviceName: {{ $headless }}
  replicas: {{ $replicas }}
  selector:
    matchLabels:
      {{- include "spatiumddi.componentSelectorLabels" (merge (dict "component" $cmp) .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "spatiumddi.componentSelectorLabels" (merge (dict "component" $cmp) .) | nindent 8 }}
    spec:
      {{- include "spatiumddi.hostUsers" (dict "value" .Values.redis.hostUsers "conflict" false "workload" "redis" "why" "") | nindent 6 }}
      {{- with (include "spatiumddi.priorityClassName" (dict "component" .Values.redis.priorityClassName "fallback" (.Values.global).priorityClassName)) }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- with (include "spatiumddi.seccompProfileType" $) }}
        seccompProfile:
          type: {{ . }}
        {{- end }}
        fsGroup: 999
      initContainers:
        # Render redis.conf + sentinel.conf from the ConfigMap template:
        # the password, this pod's stable FQDN, and its role, taken from
        # the running sentinels (#1442; the script says how).
        - name: render-config
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              {{- .Files.Get "files/redis-sentinel-render-config.sh" | nindent 14 }}
          env:
            - name: REDIS_STS
              value: {{ $sts | quote }}
            - name: REDIS_HEADLESS
              value: {{ $headless | quote }}
            - name: REDIS_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: REDIS_MASTER_SET
              value: {{ $master | quote }}
          {{- if $authEnabled }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "spatiumddi.redisSecretName" . }}
                  key: {{ include "spatiumddi.redisSecretPasswordKey" . }}
          {{- end }}
          volumeMounts:
            - name: tmpl
              mountPath: /tmpl
            - name: data
              mountPath: /data
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          command: ["redis-server", "/data/redis.conf"]
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
        - name: sentinel
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          # Sentinel needs a brief delay so the local redis-server is
          # up + (for replicas) has begun syncing before sentinel
          # starts monitoring; otherwise the first probe flaps.
          command: ["sh", "-c", "sleep 5 && exec redis-sentinel /data/sentinel.conf"]
          ports:
            - name: sentinel
              containerPort: 26379
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            tcpSocket:
              port: sentinel
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
      volumes:
        - name: tmpl
          configMap:
            name: {{ $fullname }}-redis-sentinel-tmpl
        {{- if not .Values.redis.persistence.enabled }}
        # No PVC — data dir is ephemeral (cache only; config is
        # re-rendered by the init container on every restart).
        - name: data
          emptyDir: {}
        {{- end }}
      {{- include "spatiumddi.controlPlaneNodeSelector" (merge (dict "componentNodeSelector" .Values.redis.nodeSelector) .) | nindent 6 }}
      {{- with .Values.redis.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Spread the redis pods across nodes so a single node loss doesn't
      # take the quorum with it.
      #
      # #590 — this used to be ``preferred`` (best-effort), which was
      # silently useless on the appliance. The seed installs with
      # ``sentinel.replicas: 1``; promote patches it to cp_size, and the
      # StatefulSet scales 1→3 while the freshly-promoted members may not
      # yet carry the control-plane node label. The seed is then the only
      # SCHEDULABLE node, and ``preferred`` cheerfully stacks redis-1 next
      # to redis-0 on it — where ``persistence.enabled`` pins its
      # local-path PV forever. One node loss then took 2 of 3 replicas
      # (data majority AND sentinel quorum) with it.
      #
      # ``hard`` (requiredDuringScheduling) instead leaves redis-1 Pending
      # for the few seconds it takes the member to come up labelled, then
      # binds its PV on the right node. The shared helper emits nothing
      # below 2 replicas — a single-replica (single-node / dev) install has
      # nothing to spread and must stay schedulable — and MERGES an
      # operator-supplied ``redis.affinity`` rather than replacing it.
      {{- include "spatiumddi.podAntiAffinity" (merge (dict "component" $cmp "mode" "hard" "replicas" $replicas "override" .Values.redis.affinity) .) | nindent 6 }}
  {{- if .Values.redis.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.redis.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.redis.persistence.size | quote }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $headless }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spatiumddi.componentLabels" (merge (dict "component" $cmp) .) | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "spatiumddi.componentSelectorLabels" (merge (dict "component" $cmp) .) | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
    - name: sentinel
      port: 26379
      targetPort: sentinel
---
# Sentinel Service — the app's ``sentinel://`` URL points here. Load-
# balances across all sentinel pods; redis-py / kombu try each in turn
# to find the current master.
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-redis-sentinel
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spatiumddi.componentLabels" (merge (dict "component" $cmp) .) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "spatiumddi.componentSelectorLabels" (merge (dict "component" $cmp) .) | nindent 4 }}
  ports:
    - name: sentinel
      port: 26379
      targetPort: sentinel
{{- end }}
