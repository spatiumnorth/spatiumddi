{{- $kubeletCA := .Values.api.kubeletCA -}}
{{- $cmp := "worker" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "spatiumddi.fullname" . }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spatiumddi.componentLabels" (merge (dict "component" $cmp) .) | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  {{- include "spatiumddi.deploymentStrategy" (dict "mode" .Values.worker.podAntiAffinity "replicas" .Values.worker.replicas) | nindent 2 }}
  selector:
    matchLabels:
      {{- include "spatiumddi.componentSelectorLabels" (merge (dict "component" $cmp) .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "spatiumddi.componentSelectorLabels" (merge (dict "component" $cmp) .) | nindent 8 }}
      {{- with .Values.worker.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "spatiumddi.hostUsers" (dict "value" .Values.worker.hostUsers "conflict" (.Values.api.applianceHostMounts.enabled) "workload" "worker" "why" "the appliance host mounts are on, and the worker WRITES packet captures into the shared pcap hostPath") | nindent 6 }}
      {{- with (include "spatiumddi.priorityClassName" (dict "component" .Values.worker.priorityClassName "fallback" (.Values.global).priorityClassName)) }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with (include "spatiumddi.seccompProfileType" $) }}
      securityContext:
        seccompProfile:
          type: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: 60
      {{- if .Values.worker.serviceAccount.enabled }}
      # #983 Phase 2 — alert evaluation runs HERE, not in the api, so the
      # node_pressure rule needs the worker to be able to read the kubelet
      # Summary API. Narrow grant; see worker-rbac.yaml.
      serviceAccountName: {{ include "spatiumddi.fullname" . }}-worker
      {{- end }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "spatiumddi.waitForMigrateInit" . | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "spatiumddi.image" (merge (dict "imageName" "spatiumddi-api") .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.worker.netRawCapability }}
          # NET_RAW unlocks nmap raw-socket scans (SYN, ``-O`` OS
          # detection) for the device-profiling auto-nmap path. The
          # image already grants the cap to the nmap binary via setcap;
          # this line keeps it in the pod bounding set so restricted
          # PSA / OpenShift-SCC clusters don't drop it.
          securityContext:
            capabilities:
              add: ["NET_RAW"]
          {{- end }}
          command:
            - celery
            - -A
            - app.celery_app
            - worker
            - --loglevel=info
            - --concurrency={{ .Values.worker.concurrency }}
            - -Q
            - {{ .Values.worker.queues | quote }}
          env:
            {{- include "spatiumddi.commonEnv" . | nindent 12 }}
            # #989 item 3 — the node this replica runs on. SCHEDULED
            # backups run here, and a removable destination is
            # node-local: without this the worker cannot say which node
            # the disk is plugged into, so a run that lands on the wrong
            # one reports only that nothing is mounted. The api has had
            # this since #983; the worker never did.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- if $kubeletCA.enabled }}
            # #983 Phase 2 — the worker runs alert evaluation, so it makes the
            # same direct kubelet call the api does and needs the same CA.
            # One values key for both; two would drift.
            - name: SPATIUM_KUBELET_CA_PATH
              value: {{ $kubeletCA.mountPath | quote }}
            {{- end }}
          # Worker has no HTTP listener — Celery-native ping over the
          # broker confirms this specific worker is alive. Using
          # ``$HOSTNAME`` scopes the ping to this pod, not any random
          # worker on the broker.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - celery -A app.celery_app inspect ping -d "celery@${HOSTNAME}" --timeout 5 >/dev/null 2>&1
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          {{- if or .Values.api.applianceHostMounts.enabled $kubeletCA.enabled }}
          volumeMounts:
            {{- if $kubeletCA.enabled }}
            - name: kubelet-ca
              mountPath: {{ $kubeletCA.mountPath }}
              subPath: {{ base $kubeletCA.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.api.applianceHostMounts.enabled }}
            # #59 — packet-capture .pcap store. The worker WRITES captures
            # here; the api reads them back on download. Same single-node
            # shared hostPath (firstboot chowns it 1000:1000).
            - name: pcaps
              mountPath: /var/lib/spatiumddi/pcaps
            # #1160 — local-volume backup archives. The worker WRITES every
            # scheduled run here; the api lists / downloads / restores from
            # the same hostPath (firstboot chowns it 1000:1000).
            - name: backups
              mountPath: /var/lib/spatiumddi/backups
            # #989 item 3 — removable (USB) backup disks. HostToContainer
            # propagation is the whole reason this works: with the DEFAULT
            # private propagation a disk the host mounts AFTER this pod
            # started is invisible here, so a backup would write to the
            # empty underlying directory on the appliance's own /var and
            # report success. Measured, not assumed. Read-write — the
            # {api,worker} write archives into <disk>/spatiumddi, which the
            # host runner chowns to this pod's uid.
            - name: removable
              mountPath: /var/lib/spatiumddi/removable
              mountPropagation: HostToContainer
            {{- end }}
          {{- end }}
      {{- if or .Values.api.applianceHostMounts.enabled $kubeletCA.enabled }}
      volumes:
        {{- if $kubeletCA.enabled }}
        - name: kubelet-ca
          hostPath:
            path: {{ $kubeletCA.hostPath }}
            type: File
        {{- end }}
        {{- if .Values.api.applianceHostMounts.enabled }}
        - name: pcaps
          hostPath:
            path: {{ .Values.api.applianceHostMounts.pcapsDir }}
            type: DirectoryOrCreate
        # #1160 — local-volume backup archives (shared with the api).
        - name: backups
          hostPath:
            path: {{ .Values.api.applianceHostMounts.backupsDir }}
            type: DirectoryOrCreate
        # #989 item 3 — removable (USB) backup disks. DirectoryOrCreate:
        # spatiumddi-firstboot makes it, but a node that has never had a
        # disk plugged in must not fail to schedule over an empty dir.
        - name: removable
          hostPath:
            path: {{ .Values.api.applianceHostMounts.removableDir }}
            type: DirectoryOrCreate
        {{- end }}
      {{- end }}
      {{- include "spatiumddi.controlPlaneNodeSelector" (merge (dict "componentNodeSelector" .Values.worker.nodeSelector) .) | nindent 6 }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "spatiumddi.podAntiAffinity" (merge (dict "component" $cmp "mode" .Values.worker.podAntiAffinity "replicas" .Values.worker.replicas "override" .Values.worker.affinity) .) | nindent 6 }}
      {{- include "spatiumddi.topologySpreadConstraints" (merge (dict "component" $cmp "mode" .Values.worker.podAntiAffinity "replicas" .Values.worker.replicas "override" .Values.worker.topologySpreadConstraints) .) | nindent 6 }}
