{{/*
#983 Phase 2 item 7 — a ServiceAccount for the Celery worker.

WHY THE WORKER NEEDS ONE AT ALL. Alert evaluation runs in the worker
(``app.tasks.alerts`` → ``services.alerts.evaluate_all``), not in the api.
The ``node_pressure`` rule reads PSI out of the kubelet Summary API, so
without a mounted ServiceAccount the worker's ``get_config()`` returns None,
every fetch reports the cluster unavailable, and the rule can never fire —
it would have shipped as dead code that looked enabled in the Alerts UI.

The grant is deliberately MUCH narrower than the api's. The worker gets:

  * ``nodes [get, list]``  — enumerate the cluster's nodes.
  * ``nodes/stats [get]``  — the Summary API on each kubelet, and nothing
                             else on the kubelet (#983 item 6).
  * optionally ``nodes/proxy [get]`` while the fallback transport is on.

Its baseline grant has NO pods/eviction, HelmChartConfig patch, Secret
write or node patch. Sharing the api's ServiceAccount would have been one
line and would have handed the widest task surface in the product the
ability to cordon nodes and evict pods.

THE ONE EXCEPTION: the rolling-upgrade orchestrator (#1445). It runs in the
worker, as the ``app.tasks.upgrade_orchestrator`` Celery task, and needs the
upgrade lease, node cordon and eviction, the CNPG Cluster patch and the
HelmChartConfig patch. With only the api's ServiceAccount bound to those,
the orchestrator could never take its lease on a real cluster. So when
``api.upgradeOrchestratorRBAC.enabled`` is on, the worker is bound to the
orchestrator's ClusterRole and kube-system Role, plus a namespaced Role of
its own carrying only the orchestrator's rules from the api's Role. That
Role leaves out the api's Secret patch and Deployment patch on purpose.

``get_cluster_health`` also lists pods cluster-wide, which is NOT granted
here: that call already degrades to an empty pod list on a non-200, and the
node PSI the rule reads does not depend on it. So the worker sees nodes
without pod detail, which is exactly what it needs and no more.
*/}}
{{- if .Values.worker.serviceAccount.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "spatiumddi.fullname" . }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spatiumddi.componentLabels" (merge (dict "component" "worker") .) | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "spatiumddi.fullname" . }}-worker-node-metrics
  labels:
    {{- include "spatiumddi.componentLabels" (merge (dict "component" "worker") .) | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["nodes/stats"]
    verbs: ["get"]
  {{- if .Values.api.upgradeOrchestratorRBAC.kubeletProxyFallback }}
  # Same fallback the api carries, and the same reason it is still here —
  # see api-rbac.yaml. Drops out with the api's when the direct transport is
  # confirmed on a cluster.
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "spatiumddi.fullname" . }}-worker-node-metrics
  labels:
    {{- include "spatiumddi.componentLabels" (merge (dict "component" "worker") .) | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "spatiumddi.fullname" . }}-worker
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "spatiumddi.fullname" . }}-worker-node-metrics
{{- if and .Values.api.serviceAccount.enabled .Values.api.upgradeOrchestratorRBAC.enabled }}
---
# #1445 — the orchestrator's namespaced rules, the same as the
# upgradeOrchestratorRBAC block of the api's Role and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "spatiumddi.fullname" . }}-worker-upgrade-orchestrator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spatiumddi.componentLabels" (merge (dict "component" "worker") .) | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    # No ``delete``, as in the api's Role: release clears the holder.
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "spatiumddi.fullname" . }}-worker-upgrade-orchestrator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spatiumddi.componentLabels" (merge (dict "component" "worker") .) | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "spatiumddi.fullname" . }}-worker
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "spatiumddi.fullname" . }}-worker-upgrade-orchestrator
---
# Cordon, eviction and node reads: the api's orchestrator ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "spatiumddi.fullname" . }}-worker-upgrade-orchestrator
  labels:
    {{- include "spatiumddi.componentLabels" (merge (dict "component" "worker") .) | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "spatiumddi.fullname" . }}-worker
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "spatiumddi.fullname" . }}-api-upgrade-orchestrator
---
# The chart bump's HelmChartConfig patch in kube-system: the api's Role.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "spatiumddi.fullname" . }}-worker-helm
  namespace: kube-system
  labels:
    {{- include "spatiumddi.componentLabels" (merge (dict "component" "worker") .) | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "spatiumddi.fullname" . }}-worker
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "spatiumddi.fullname" . }}-api-helm
{{- end }}
{{- end }}
