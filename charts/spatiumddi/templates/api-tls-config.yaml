{{- if .Values.api.tlsListener.enabled }}
{{- /* #4430 — the api pod's TLS sidecar (see api.tlsListener in values.yaml).
       Mounted over the frontend image's default template. The image's entrypoint
       envsubst's it, and nothing below is an environment variable. The sidecar
       OVERWRITES X-Forwarded-For with the address it accepted the connection
       from, and the api believes that header only from its loopback peer. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "spatiumddi.fullname" . }}-api-tls-conf
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spatiumddi.componentLabels" (merge (dict "component" "api") .) | nindent 4 }}
data:
  default.conf.template: |
    server {
        listen 8443 ssl default_server;
        server_name _;
        server_tokens off;
        ssl_certificate     /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Heartbeats long-poll and the proxied tool replies can be large;
        # neither is buffered to disk.
        client_max_body_size     1g;
        proxy_request_buffering  off;
        proxy_buffering          off;
        proxy_read_timeout       1800s;
        proxy_send_timeout       1800s;

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
        }
    }
{{- end }}
