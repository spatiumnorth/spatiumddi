{{/*
Chart-owned secret carrying SECRET_KEY (Fernet key used at rest for
auth-provider secrets, API tokens at creation, session cookies, etc.) and the
/metrics scrape token (#1159). Both are generated the same way.

Generated on first install; preserved across upgrades via `lookup` AND
across an uninstall/reinstall via `helm.sh/resource-policy: keep` (#1042).

BOTH halves are load-bearing, and the second was missing. `lookup` only
sees a Secret that still exists, so it preserves the key across an
*upgrade*. A k3s HelmChart defaults to `failurePolicy: reinstall`, which
performs a clean uninstall + install whenever it finds the release not
`deployed` — and on that path an unannotated Secret is DELETED, `lookup`
then finds nothing, and `randAlphaNum 64` mints a new SECRET_KEY. Because
`app/core/crypto.py` derives the at-rest Fernet key from SECRET_KEY when
no explicit CREDENTIAL_ENCRYPTION_KEY is set, that orphans every value
`encrypt_str` ever wrote — the appliance CA private key (so no cluster
member can be approved or re-keyed), appliance certs, integration
credentials, OIDC/SAML secrets — and invalidates every JWT, while the
control plane still reports healthy. Observed on three ddi-pg slot-upgrade
walks; the Postgres and Redis secrets survived the same event purely
because they carry this annotation and this one did not.

#1358 — the same Secret carries a dedicated at-rest key, `credential-key`
(CREDENTIAL_ENCRYPTION_KEY), so stored credentials are no longer encrypted
under a key derived from SECRET_KEY. It is minted on the first render that
finds the Secret without one — including an UPGRADE of an install that has
none — and kept by the same `lookup` + `keep` pair as `secret-key`. That is
safe on an upgrade because `app/core/crypto.py` keeps the SECRET_KEY-derived
key as a read fallback: values written before it existed still decrypt, and
`python -m app.core.rotate_credential_key` moves them across. The upgrade
that adds it also stamps `credential-key-since`, so that release does not yet
WRITE with it (see below). A render with no `lookup` (helm template, GitOps
diff) cannot see the stored key and generates none; pin it with
`auth.credentialEncryptionKey` there.

Rotation is unchanged and still explicit: set `auth.secretKey`, or own the
Secret yourself via `auth.existingSecret`. Same contract as the Postgres
and Redis secrets — `keep` leaves the Secret behind on uninstall, so a
deliberate fresh start means deleting it.

Postgres password lives in the Postgres subchart's own secret
(<release>-postgresql) or, for external DB, in
externalDatabase.existingSecret — both accessed directly by the
workload env without being duplicated here.

Skipped when auth.existingSecret is set — you own the rotation story.
*/}}
{{- if not .Values.auth.existingSecret }}
{{- $secretName := printf "%s-app" (include "spatiumddi.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $prevKey := "" -}}
{{- $prevMetricsToken := "" -}}
{{- $prevCredentialKey := "" -}}
{{- $prevCredentialKeySince := "" -}}
{{- if $existing -}}
{{- $prevKey = index $existing.data "secret-key" | b64dec -}}
{{- $prevMetricsToken = index $existing.data "metrics-token" | default "" | b64dec -}}
{{- $prevCredentialKey = index $existing.data "credential-key" | default "" | b64dec -}}
{{- $prevCredentialKeySince = index $existing.data "credential-key-since" | default "" | b64dec -}}
{{- end -}}
{{- $secretKey := .Values.auth.secretKey | default $prevKey | default (randAlphaNum 64) -}}
{{- $metricsToken := .Values.auth.metricsToken | default $prevMetricsToken | default (randAlphaNum 48) -}}
{{- /* #1358 — the credential key is generated ONLY when this render can see
       the cluster. A render without `lookup` (helm template, an Argo CD / Flux
       diff) cannot see the stored key, so generating there would mint a NEW
       key on every sync and strand everything written under the last one; it
       renders no key instead (the api then derives one from SECRET_KEY, as
       before) unless auth.credentialEncryptionKey pins it. The probe is the
       namespace's `default` ServiceAccount, which every real namespace has.
       A Fernet key is url-safe base64 of 32 random bytes. */ -}}
{{- $clusterVisible := or $existing (lookup "v1" "ServiceAccount" .Release.Namespace "default") -}}
{{- $credentialKey := .Values.auth.credentialEncryptionKey | default $prevCredentialKey -}}
{{- if and (not $credentialKey) $clusterVisible -}}
{{- $credentialKey = randBytes 32 | replace "+" "-" | replace "/" "_" -}}
{{- end -}}
{{- /* #1358 — CREDENTIAL_KEY_SINCE: the release whose rollout added the key to
       an install that was already running. Pods of that release read the key
       but keep WRITING under the SECRET_KEY-derived one, because the rollout
       can still have pods (older image, or started before this Secret had the
       key) that cannot read it; the next release writes with it. Kept once
       set. Stamped when the key is new to an existing Secret, or when it is
       pinned on a render that cannot see the cluster (where an install that
       predates the key cannot be ruled out); empty on a fresh install. */ -}}
{{- $credentialKeySince := .Values.auth.credentialKeySince | default $prevCredentialKeySince -}}
{{- if and $credentialKey (not $prevCredentialKey) (not $credentialKeySince) (or $existing (not $clusterVisible)) -}}
{{- $credentialKeySince = toString (.Values.image.tag | default .Chart.AppVersion) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spatiumddi.labels" . | nindent 4 }}
  annotations:
    # #1042 — see the header. Without this, a `failurePolicy: reinstall`
    # uninstall deletes the Secret and the reinstall mints a new
    # SECRET_KEY, orphaning everything encrypted at rest.
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  secret-key: {{ $secretKey | quote }}
  # #1358 — CREDENTIAL_ENCRYPTION_KEY, the Fernet key stored credentials are
  # encrypted under. Losing it makes everything written after it unreadable:
  # it is backed up in the backup archive's secrets envelope, and `keep`
  # above leaves the Secret behind on uninstall.
  {{- if $credentialKey }}
  credential-key: {{ $credentialKey | quote }}
  {{- end }}
  {{- if $credentialKeySince }}
  credential-key-since: {{ $credentialKeySince | quote }}
  {{- end }}
  # #1159 — the bearer token /metrics accepts (any API token works too).
  # Read it back with:
  #   kubectl get secret <this Secret> -o jsonpath='{.data.metrics-token}' | base64 -d
  metrics-token: {{ $metricsToken | quote }}
{{- end }}
