{{- if and .Values.postgresql.enabled (eq (.Values.postgresql.kind | default "standalone") "cnpg") }}
{{- $cmp := "postgresql" -}}
{{- $fullname := include "spatiumddi.fullname" . -}}
{{- $clusterName := printf "%s-postgresql" $fullname -}}
{{- $secretName := printf "%s-postgresql" $fullname -}}
# ─────────────────────────────────────────────────────────────────────────────
# Postgres HA via CloudNativePG (#272 Phase 2).
#
# Renders a ``Cluster`` CR (postgresql.cnpg.io/v1) which the operator
# (installed separately — see values.yaml's ``postgresql.kind: cnpg``
# block) reconciles into a primary + N-1 replicas, automatic failover,
# rolling restart on parameter changes, and per-instance PVCs.
#
# Services CNPG creates automatically (do NOT define them here):
#   <cluster>-rw   read/write — always points at the current primary
#   <cluster>-r    read-only — round-robins primary + sync replicas
#   <cluster>-ro   read-only — replicas only (excludes primary)
#
# The api / worker / beat / migrate Deployments point at
# ``<cluster>-rw`` via the ``spatiumddi.postgresHost`` helper — no
# template changes elsewhere.
#
# The bootstrap Secret (``spatiumddi-postgresql``) is shared with the
# standalone shape so a kind=standalone → kind=cnpg switch reuses the
# same credentials. Generated in this file the same way the
# standalone template does, with the lookup() rollback-safe pattern.
# ─────────────────────────────────────────────────────────────────────────────

# Credentials Secret is rendered by templates/postgres-secret.yaml —
# same shape (``kubernetes.io/basic-auth`` with username + password
# keys) regardless of kind. CNPG accepts that secret directly via the
# ``bootstrap.initdb.secret.name`` reference below.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $clusterName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # #272 — NEVER let a Helm operation delete the Postgres cluster (and
    # therefore its operator-managed PVCs + the database itself). The
    # k3s helm-controller can drop a release into a ``failed`` state
    # (a slow first boot, or a cp-size upgrade racing the initial
    # install). Its recovery for a failed release is uninstall+reinstall,
    # which would delete this Cluster CR → the CNPG operator GCs the
    # PVCs → the reinstall runs a fresh ``initdb`` → the DB is wiped.
    # Observed live on a #272 promote: the Postgres data volume was
    # destroyed while Redis (a plain StatefulSet) scaled in place.
    #
    # ``resource-policy: keep`` makes Helm leave this resource in place on
    # uninstall/rollback — the data-safety goal. It does NOT stop an
    # upgrade from patching it: the k3s helm-controller re-applies this
    # Cluster on every upgrade, as a server-side apply that may not force
    # a conflict (#1313). The supervisor sizes ``spec.instances`` itself
    # (k8s_api.patch_cnpg_instances, called from the heartbeat: a scale-up
    # at once, a scale-down held while a dead node is replaced, #1059) and
    # renders ``postgresql.cnpg.instances`` into the spatium-control
    # HelmChartConfig as the count that patch left, so the apply below
    # never tries to change a field the supervisor's patch wrote. One that
    # did failed the upgrade, and the helm-controller's recovery
    # uninstalled the whole release, again on every retry. The data only
    # ever goes away when the node/cluster is intentionally destroyed
    # (factory reset / node delete).
    helm.sh/resource-policy: keep
  labels:
    {{- include "spatiumddi.componentLabels" (merge (dict "component" $cmp) .) | nindent 4 }}
spec:
  instances: {{ .Values.postgresql.cnpg.instances }}
  imageName: {{ .Values.postgresql.cnpg.imageName | quote }}

  {{- with (include "spatiumddi.priorityClassName" (dict "component" .Values.postgresql.priorityClassName "fallback" (.Values.global).priorityClassName)) }}
  # #983 — CNPG passes this straight through to the instance pods.
  priorityClassName: {{ . | quote }}
  {{- end }}
  {{- with (include "spatiumddi.seccompProfileType" $) }}
  # #983 — CNPG owns the instance pods' securityContext, so the chart-wide
  # knob has to be handed to the operator rather than set on a pod template.
  # The CRD already defaults this field to ``RuntimeDefault``; setting it
  # explicitly is what makes ``global.seccompProfile: Unconfined`` mean the
  # same thing here as everywhere else.
  seccompProfile:
    type: {{ . }}
  {{- end }}
  # NOTE ``helm.sh/resource-policy: keep`` does not make these fields
  # first-create-only: the helm-controller re-applies this CR on every
  # upgrade (#1313). ``keep`` only keeps it, and the database with it,
  # through a Helm-driven delete.

  # #296 Phase A — PDB on by default (set in values.yaml). Suspended
  # during a rolling-upgrade node's maintenance window — the api-side
  # orchestrator stamps + clears
  # ``spec.nodeMaintenanceWindow.inProgress``. Outside the upgrade flow
  # the PDB prevents accidental simultaneous primary eviction (e.g. a
  # manual ``kubectl drain`` of two nodes at once). Sprig's ``| default``
  # treats ``false`` as falsy and would emit ``true``, so we read the
  # value directly and require the user to set it in values.yaml.
  enablePDB: {{ .Values.postgresql.cnpg.enablePDB }}

  postgresql:
    parameters:
      {{- toYaml .Values.postgresql.cnpg.parameters | nindent 6 }}

  bootstrap:
    initdb:
      database: {{ .Values.postgresql.auth.database | quote }}
      owner: {{ .Values.postgresql.auth.username | quote }}
      secret:
        name: {{ include "spatiumddi.postgresSecretName" . }}

  {{- if .Values.postgresql.cnpg.appRoleCreateDb }}
  # Restore-verification drills (#702) create a throwaway
  # ``spatiumddi_drill_*`` database, replay the newest backup archive
  # into it, assert, and drop it again. ``initdb.owner`` is a plain
  # LOGIN role with no CREATEDB and ``enableSuperuserAccess`` is off,
  # so without this grant every drill dies at "permission denied to
  # create database" and the feature can never run on an appliance.
  #
  # ``managed.roles`` reconciles attributes on EXISTING clusters too
  # (unlike ``initdb.postInitSQL``, which only fires on first
  # bootstrap), so this grant reaches installs that predate #702.
  #
  # Set ``postgresql.cnpg.appRoleCreateDb: false`` to withhold it —
  # drills then report a clear "role lacks CREATEDB" error rather
  # than failing obscurely.
  managed:
    roles:
      - name: {{ .Values.postgresql.auth.username | quote }}
        ensure: present
        login: true
        createdb: true
  {{- end }}

  storage:
    size: {{ .Values.postgresql.persistence.size | quote }}
    {{- with .Values.postgresql.persistence.storageClass }}
    storageClass: {{ . | quote }}
    {{- end }}

  resources:
    {{- toYaml .Values.postgresql.resources | nindent 4 }}

  {{- /* CNPG nests nodeSelector + tolerations + pod anti-affinity under
         spec.affinity. Inline the standard control-plane label merge from
         spatiumddi.controlPlaneNodeSelector and add the rest beside it. */ -}}
  {{- $globalSel := default (dict) ((.Values.global | default (dict)).controlPlaneNodeSelector) -}}
  {{- $componentSel := default (dict) .Values.postgresql.nodeSelector -}}
  {{- $mergedSel := merge (dict) $componentSel $globalSel }}
  affinity:
    # #590 — spread the Postgres instances one per node.
    #
    # CNPG enables pod anti-affinity by default, but only as ``preferred``
    # (best effort). Observed live on a 1→3 promote: instances 1 and 2 both
    # landed on the seed, because the freshly promoted members hadn't come up
    # carrying the control-plane node label by the time the operator created
    # the new pods. Losing that one node would then have taken the primary AND
    # a replica together — the same failure mode #590 fixes for Redis, whose
    # replicas stacked on the seed for exactly the same reason.
    #
    # ``required`` leaves an instance Pending for the seconds it takes a member
    # to come up labelled, then binds its PVC on the right node. Unlike the
    # api/worker Deployments this cannot deadlock a rollout: CNPG updates an
    # instance in place (same pod name, same PVC) rather than surging a second
    # copy alongside it, so no instance ever contends with itself for a node.
    #
    # Chart default stays ``preferred`` — a BYO-Kubernetes install may run more
    # instances than nodes, and a Pending replica is worse than a co-located
    # one there. The appliance renders ``required``, where the instance count
    # tracks the control-plane node count exactly.
    enablePodAntiAffinity: {{ .Values.postgresql.cnpg.enablePodAntiAffinity }}
    podAntiAffinityType: {{ .Values.postgresql.cnpg.podAntiAffinityType | quote }}
    topologyKey: {{ .Values.postgresql.cnpg.topologyKey | quote }}
    {{- if $mergedSel }}
    nodeSelector:
      {{- toYaml $mergedSel | nindent 6 }}
    {{- end }}
    {{- with .Values.postgresql.tolerations }}
    tolerations:
      {{- toYaml . | nindent 6 }}
    {{- end }}

  {{- if .Values.postgresql.cnpg.monitoring.enablePodMonitor }}
  monitoring:
    enablePodMonitor: true
  {{- end }}

  {{- if .Values.postgresql.cnpg.backup.enabled }}
  backup:
    retentionPolicy: {{ .Values.postgresql.cnpg.backup.retentionPolicy | quote }}
    {{- with .Values.postgresql.cnpg.backup.barmanObjectStore }}
    barmanObjectStore:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
{{- end }}
