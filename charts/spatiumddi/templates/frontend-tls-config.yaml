{{- if .Values.frontend.tls.enabled }}
{{- /* Phase 11 wave 3 (#183) — TLS-aware nginx config for the appliance.

       Mounted into the frontend pod at
       /etc/nginx/templates/default.conf.template via a subpath
       mount in the Deployment so it replaces the image's default
       (port 80 only) template. The image's standard entrypoint
       (20-envsubst-on-templates.sh) substitutes ${API_UPSTREAM_*}
       + ${NGINX_LOCAL_RESOLVERS} from env, same as the default.

       Two server blocks:

       * ``:80``  — 301 → https. Operators bookmarking the bare
                    IP land on TLS without thinking.
       * ``:443`` — real TLS-terminated frontend. Cert + key
                    paths line up with the Secret mount at
                    /etc/nginx/tls/ (subPath=tls.crt + tls.key,
                    the standard kubernetes.io/tls Secret keys). */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "spatiumddi.fullname" . }}-frontend-tls-conf
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spatiumddi.componentLabels" (merge (dict "component" "frontend") .) | nindent 4 }}
data:
  default.conf.template: |
    # Plain HTTP — redirect to HTTPS. Single permanent (301) so
    # browsers cache it; operators hitting :80 once never have to
    # think about it again.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

        # ACME http-01 challenge (issue #438) — served over plain HTTP so
        # the CA reaches it before the HTTPS redirect. In its own location
        # (not the server-level return) so location matching wins.
        location /.well-known/acme-challenge/ {
            set $api_upstream http://${API_UPSTREAM_HOST}:${API_UPSTREAM_PORT};
            proxy_pass         $api_upstream;
            proxy_set_header   Host $http_host;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }

        # nginx-local healthcheck — the frontend Deployment's liveness +
        # readiness probes target this (#767). Declared explicitly rather
        # than leaning on the 301 below happening to count as a probe
        # success: this container's health is nginx's, and it must stay
        # answerable while the api is down.
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS — same routing the image's default template has,
    # wrapped in TLS termination using the cert mounted by the
    # secret volume at /etc/nginx/tls/.
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        http2 on;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        ssl_certificate     /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        # Match nginx defaults; downstream HTTPS terminators
        # (cert manager) can override via operator-mounted config.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # ── Security response headers (SECURITY #400, L2; #1157) ───────
        # The same set, and the same policy, as frontend/default.conf.template
        # (the CSP rationale is there), plus HSTS. #400 put these in the
        # pre-k3s appliance config (nginx-appliance.conf), which #194 had
        # already orphaned and #768 deleted, so this block never sent any of
        # them. nginx ``add_header`` does NOT inherit into a location that
        # declares its own, so every location below with an add_header
        # re-emits the set. Must not diverge from frontend/default.conf.template.
        set $spatium_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
        # /api/redoc's policy (#1157): see ``location = /api/redoc``.
        set $spatium_redoc_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.redoc.ly; font-src 'self'; connect-src 'self'; worker-src blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
        add_header Content-Security-Policy $spatium_csp always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        # HSTS as #400 decided it for this block: refuse a downgrade for a
        # year. It cannot shut anyone out of the console. Browsers never
        # record HSTS for a bare IP (RFC 6797 §8.1.1), and the appliance is
        # reached by a node IP or the VIP by default. They also ignore the
        # header on a connection with a certificate error (§8.1), such as the
        # untrusted self-signed first-boot certificate. It takes hold only on
        # a hostname whose certificate the browser trusts. There a later
        # certificate problem is a hard error instead of a warning that can
        # be clicked through, and the IP still works. Examples: an ACME or
        # uploaded certificate that lapsed, or a trusted self-signed one
        # re-minted when a promote grows its SANs. ``includeSubDomains`` is
        # left out on purpose: the appliance serves no subdomains of its
        # hostname, and in a DDI product those names are often other hosts
        # in a zone the operator runs.
        add_header Strict-Transport-Security "max-age=31536000" always;

        resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

        # Same nginx-local healthcheck as the :80 block, so a probe
        # pointed at either port answers without touching an upstream.
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Issue #299 phase 2 — the friendly "still booting" page the
        # non-TLS image template serves, mirrored here for the
        # appliance's TLS-fronted shape. Only 502 + 504 (upstream
        # connect refused / upstream timeout); 503 stays as-is so
        # the api's intentional 503s (demo-mode, factory-reset
        # cooldown, /health/ready with schema-behind) reach the
        # operator unchanged. Status preserved (no ``=``) so the
        # SPA's axios calls reject cleanly instead of resolving with
        # an HTML string body (review polish from #301). See
        # frontend/default.conf.template for the full reasoning.
        error_page 502 504 @starting;

        location @starting {
            default_type text/html;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header X-Upstream-Status $upstream_status always;
            # Re-emit security headers (SECURITY #400, L2) — a location
            # with its own add_header does NOT inherit the server-level set.
            add_header Content-Security-Policy $spatium_csp always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            try_files /_starting.html =503;
        }

        # JSON for JSON routes (#1083). The ``/api/`` locations send their
        # 502/504 here instead of to @starting: a client polling a JSON route
        # while the api Service has no ready endpoint (a CNPG failover empties
        # it -- /health/ready needs the database) gets a JSON body with the
        # status it can retry on, never the initialising page's HTML. A
        # ``return`` has no method to refuse, so a POST that trips the 60 s
        # proxy_read_timeout gets this too instead of the 405 nginx answers
        # when error_page redirects a POST to a static file (#1080). The
        # upstream status is preserved (502 = no ready endpoint / connect
        # refused, 504 = upstream timeout) the way @starting preserves it,
        # so the SPA's per-status handling holds.
        location @api_unavailable {
            default_type application/json;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Retry-After 2 always;
            add_header X-Upstream-Status $upstream_status always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            if ($upstream_status ~ "504") {
                return 504 '{"detail":"The api did not answer in time; retry shortly."}';
            }
            return 502 '{"detail":"The api is not reachable right now; retry shortly."}';
        }

        # Large request bodies for the backup endpoint — keep the
        # same shape the default template uses.
        location /api/v1/backup/ {
            error_page 502 504 @api_unavailable;
            set $api_upstream http://${API_UPSTREAM_HOST}:${API_UPSTREAM_PORT};
            proxy_pass               $api_upstream;
            proxy_set_header         Host $http_host;
            proxy_set_header         X-Real-IP $remote_addr;
            proxy_set_header         X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header         X-Forwarded-Proto $scheme;
            proxy_http_version       1.1;
            proxy_set_header         Connection "";
            client_max_body_size     2g;
            proxy_request_buffering  off;
            proxy_read_timeout       1800s;
            proxy_send_timeout       1800s;
        }

        # Appliance upgrade-image upload — sized to the backend's own
        # MAX_UPLOAD_BYTES cap (4 GiB); the 2g backup limit above isn't
        # enough for a ~1.8-2 GB appliance slot image. Without this,
        # nginx's default body-size limit 413s the upload before
        # FastAPI's own size-check ever runs.
        location /api/v1/appliance/upgrade-images {
            error_page 502 504 @api_unavailable;
            set $api_upstream http://${API_UPSTREAM_HOST}:${API_UPSTREAM_PORT};
            proxy_pass               $api_upstream;
            proxy_set_header         Host $http_host;
            proxy_set_header         X-Real-IP $remote_addr;
            proxy_set_header         X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header         X-Forwarded-Proto $scheme;
            proxy_http_version       1.1;
            proxy_set_header         Connection "";
            client_max_body_size     4g;
            proxy_request_buffering  off;
            proxy_read_timeout       1800s;
            proxy_send_timeout       1800s;
        }

        # Storage management actions (#1080). Two budgets sit behind this
        # route, both longer than the 60 s ``proxy_read_timeout`` the
        # generic ``/api/`` block below carries: the api waits up to 90 s
        # for the appliance's supervisor (appliance/supervisor.py, the
        # storage channel's ``timeout=90.0``) before its own 504, and the
        # supervisor waits 60 s for the host runner before reporting
        # ``ok=false "the host storage runner did not answer within 60s"``
        # -- a report that reaches the api a little AFTER nginx's 60 s
        # clock, which started before the supervisor's. Either way the
        # operator got nginx's generic did-not-answer JSON at 60.000 s and
        # never the message written to send them to
        # ``journalctl -u spatiumddi-storage-action``. An exact-path regex
        # (any appliance id) so no other /api/ route waits longer; sized
        # above the route's budget with margin, the way the backup and
        # upgrade-image blocks are sized to theirs. Must not diverge from
        # frontend/default.conf.template.
        location ~ ^/api/v1/appliance/appliances/[^/]+/storage/action$ {
            error_page 502 504 @api_unavailable;
            set $api_upstream http://${API_UPSTREAM_HOST}:${API_UPSTREAM_PORT};
            proxy_pass         $api_upstream;
            proxy_set_header   Host $http_host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ReDoc's page-only policy (#1157): a blob: worker for its search
        # index and its footer logo on cdn.redoc.ly. Scripts stay 'self'.
        # frontend/default.conf.template has the reasoning. add_header here
        # replaces the server-level set, so the rest of it is re-emitted.
        # Must not diverge from frontend/default.conf.template.
        location = /api/redoc {
            add_header Content-Security-Policy $spatium_redoc_csp always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            error_page 502 504 @api_unavailable;
            set $api_upstream http://${API_UPSTREAM_HOST}:${API_UPSTREAM_PORT};
            proxy_pass         $api_upstream;
            proxy_set_header   Host $http_host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_read_timeout 60s;
        }

        # The API docs' own assets (#1157), served by the api so /api/docs
        # and /api/redoc run under ``script-src 'self'`` and need no CDN.
        # ``^~`` keeps the static-asset regex below from answering these
        # ``.js`` / ``.css`` paths from this pod's disk (a 404). Must not
        # diverge from frontend/default.conf.template.
        location ^~ /api/docs/static/ {
            error_page 502 504 @api_unavailable;
            set $api_upstream http://${API_UPSTREAM_HOST}:${API_UPSTREAM_PORT};
            proxy_pass         $api_upstream;
            proxy_set_header   Host $http_host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_read_timeout 60s;
        }

        location /api/ {
            error_page 502 504 @api_unavailable;
            set $api_upstream http://${API_UPSTREAM_HOST}:${API_UPSTREAM_PORT};
            proxy_pass         $api_upstream;
            proxy_set_header   Host $http_host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_read_timeout 60s;
        }

        # HELD (RFC 5985) — #972. At the application root rather than under
        # /api/ because a HELD client is configured with a whole URL and the
        # protocol names this path. Without its own location it falls through
        # to the SPA ``location /`` and a PBX asking where a phone is gets
        # index.html with a 200. Must not diverge from
        # frontend/default.conf.template.
        location /held {
            set $api_upstream http://${API_UPSTREAM_HOST}:${API_UPSTREAM_PORT};
            proxy_pass         $api_upstream;
            proxy_set_header   Host $http_host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_read_timeout 60s;
        }

        # ACME http-01 challenge (issue #438) — also reachable over HTTPS
        # so a CA that follows the :80→:443 redirect still resolves it.
        location /.well-known/acme-challenge/ {
            set $api_upstream http://${API_UPSTREAM_HOST}:${API_UPSTREAM_PORT};
            proxy_pass         $api_upstream;
            proxy_set_header   Host $http_host;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }

        location ~ ^/(health|metrics) {
            set $api_upstream http://${API_UPSTREAM_HOST}:${API_UPSTREAM_PORT};
            proxy_pass $api_upstream;
            proxy_set_header Host $http_host;
        }

        # Boot gate for the SPA fallback (issue #767). Mirrors
        # frontend/default.conf.template — the two must not diverge.
        # ``location /`` serves index.html off local disk, so it has no
        # upstream to fail on and the error_page above could never fire
        # for it: an operator browsing a cold-booting appliance got the
        # SPA shell plus failing XHRs instead of the initialising page.
        # The auth_request sub-request gives it an upstream to fail on,
        # and hits the api SERVICE, so an api that is up but not READY
        # (migrations still landing) correctly reads as "not yet".
        location = /_api_up {
            internal;
            set $api_upstream http://${API_UPSTREAM_HOST}:${API_UPSTREAM_PORT};
            proxy_pass              $api_upstream/health/live;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
            proxy_set_header        Host $http_host;
            # resolver_timeout is not covered by the proxy_* timeouts and
            # defaults to 30 s — without it an unreachable DNS server
            # would stall every SPA page load for half a minute.
            resolver_timeout        2s;
            proxy_connect_timeout   2s;
            proxy_read_timeout      2s;
        }

        location / {
            auth_request /_api_up;
            # auth_request collapses "upstream unreachable" into a 500,
            # so 500 is in the list. Location-scoped — it replaces the
            # server-level error_page here only. Re-coded to 503: the
            # control plane isn't erroring, it isn't up yet.
            error_page 500 502 504 =503 @starting;
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|woff2?|png|svg|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            # Re-emit security headers (SECURITY #400, L2) — a location
            # with its own add_header does NOT inherit the server-level set.
            add_header Content-Security-Policy $spatium_csp always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
        }

        gzip on;
        gzip_types text/plain text/css application/javascript application/json image/svg+xml;
        # Issue #862 — without this a shared cache between the appliance and a
        # client can serve a gzipped body to a client that never asked for one,
        # because nothing in the response says the entity varies by encoding.
        # It also matters for the agent /config long-poll, whose ETag is now a
        # weak validator deliberately shared by both encodings.
        gzip_vary on;
    }
{{- end }}
