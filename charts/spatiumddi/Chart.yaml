apiVersion: v2
name: spatiumddi
description: SpatiumDDI — all-in-one DDI (DNS, DHCP, IPAM) control plane + optional managed service agents
type: application
# version + appVersion are placeholders for local `helm lint` / `helm template`
# runs. The release workflow overrides both via `helm package --version
# --app-version` using the release tag.
version: 0.1.0
appVersion: "0.0.0-dev"
# #983 — 1.26 was a claim, not a tested floor: nobody has run this chart on
# it. The oldest behaviour the charts actually depend on is the >= 1.31
# EndpointSlice loopback validation the appliance's k3s config comments
# describe, so that is the floor. Raise it when a template starts using an
# API only a later version serves — not speculatively, because the check is
# enforced by the apiserver's reported version and a floor above what an
# operator runs refuses the install outright.
kubeVersion: ">=1.31.0-0"
home: https://www.spatiumddi.com/
sources:
  - https://github.com/spatiumnorth
icon: https://www.spatiumddi.com/assets/logo-icon.svg
keywords:
  - ipam
  - dns
  - dhcp
  - ddi
  - networking
maintainers:
  - name: SpatiumDDI Contributors
    url: https://github.com/spatiumnorth/spatiumddi
# #3913 — metadata Red Hat's chart-verifier and the OpenShift Helm catalogue
# read. Informational for every other consumer. The chart is NOT yet
# certified: see docs/deployment/KUBERNETES.md (OpenShift).
annotations:
  charts.openshift.io/name: SpatiumDDI
  charts.openshift.io/provider: Spatium North Inc.
  charts.openshift.io/supportURL: https://github.com/spatiumnorth/spatiumddi/issues
  charts.openshift.io/archs: x86_64
  charts.openshift.io/providerType: partner
# #3858 — Artifact Hub listing (the repository metadata is artifacthub-repo.yml
# at the chart root, pushed to the OCI `artifacthub.io` tag by release.yml).
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Documentation
      url: https://www.spatiumddi.com/
    - name: Source
      url: https://github.com/spatiumnorth/spatiumddi
    - name: Support
      url: https://github.com/spatiumnorth/spatiumddi/issues
# Generated from .github/images.json by scripts/artifacthub.py; release.yml
# re-renders it with the release tag before packaging. Do not hand-edit.
  # artifacthub:generated:begin
  artifacthub.io/images: |
    - name: spatiumddi-api
      image: ghcr.io/spatiumnorth/spatiumddi-api:latest
    - name: spatiumddi-frontend
      image: ghcr.io/spatiumnorth/spatiumddi-frontend:latest
    - name: dns-bind9
      image: ghcr.io/spatiumnorth/dns-bind9:latest
    - name: dns-powerdns
      image: ghcr.io/spatiumnorth/dns-powerdns:latest
    - name: dns-technitium
      image: ghcr.io/spatiumnorth/dns-technitium:latest
    - name: dns-dnsdist
      image: ghcr.io/spatiumnorth/dns-dnsdist:latest
    - name: dhcp-kea
      image: ghcr.io/spatiumnorth/dhcp-kea:latest
    - name: spatium-supervisor
      image: ghcr.io/spatiumnorth/spatium-supervisor:latest
    - name: looking-glass
      image: ghcr.io/spatiumnorth/looking-glass:latest
  artifacthub.io/prerelease: "false"
  artifacthub.io/changes: |
    - kind: changed
      description: "See the release notes for latest"
      links:
        - name: Release notes
          url: https://github.com/spatiumnorth/spatiumddi/releases/tag/latest
  # artifacthub:generated:end
# No subchart dependencies. Postgres + Redis ship as plain
# StatefulSet + Service templates owned by this chart, using the
# official ``postgres:16-alpine`` and ``redis:8.10.2-alpine`` images
# (the same ones docker-compose.yml uses). The bundled subcharts
# previously came from the Bitnami chart family, but Bitnami pruned
# the ``bitnami/*`` Docker Hub namespace in late 2025 in favour of
# their paid "Bitnami Secure Images", so the pinned image tags
# stopped resolving and we'd have had to either pay or shim the
# install around their parallel ``bitnamilegacy/*`` namespace.
# Operators wanting a real HA Postgres should disable
# ``postgresql.enabled`` and bring their own (CloudNativePG / Patroni
# under k8s/ha/) via ``externalDatabase``.
