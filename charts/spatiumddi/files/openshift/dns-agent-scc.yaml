# DNS agent (BIND9): NET_BIND_SERVICE
#
# Static copy of the SecurityContextConstraints the chart renders when
# ``openshift.scc.create`` is true (templates/openshift.yaml, the
# ``spatiumddi.openshiftScc`` helper), for installs that do not let the chart
# create them (values-openshift-certified.yaml). A cluster admin applies it
# once, then grants it to the agent's ServiceAccount:
#
#   oc apply -f dns-agent-scc.yaml
#   oc adm policy add-scc-to-user spatiumddi-dns-agent -z <fullname>-dns-agent -n <namespace>
#
# .github/scripts/chart-openshift-scc-files.py fails CI when this file and the
# chart's render differ in anything but names and labels.
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: spatiumddi-dns-agent
  labels:
    app.kubernetes.io/name: spatiumddi
    app.kubernetes.io/component: dns-agent
  annotations:
    kubernetes.io/description: "DNS agent (BIND9): named binds :53 through a file capability, which needs NET_BIND_SERVICE in the bounding set and no_new_privs off. Runs as a uid from the namespace range, never root."
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: true
allowPrivilegedContainer: false
allowedCapabilities:
  - NET_BIND_SERVICE
defaultAddCapabilities: null
requiredDropCapabilities:
  - ALL
readOnlyRootFilesystem: false
fsGroup:
  type: MustRunAs
runAsUser:
  type: MustRunAsRange
seLinuxContext:
  type: MustRunAs
supplementalGroups:
  type: MustRunAs
seccompProfiles:
  - runtime/default
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - ephemeral
  - persistentVolumeClaim
  - projected
  - secret
users: []
groups: []
